<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Efetivo PA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&family=IBM+Plex+Mono:wght@500;600&family=Roboto+Condensed:wght@700;800&display=swap">
<style>
/* Layout: SAP Fiori-style shell bar, collapsible side navigation, dynamic pages (header, filter bar, table) and a right-side object panel. Brand: Parente Andrade green + orange */
:root{
  --brand-g:#619935; --brand-o:#eaa837;
  --shell:#18211b; --shell-2:#27342a; --shell-fg:#eef2ec; --shell-dim:#a4b3a5;
  --bg:#f0f3ee; --surface:#ffffff; --surface-2:#f6f8f4; --line:#dbe3d6; --line-strong:#bac7b4;
  --fg:#1c2a1f; --fg-2:#4f6150; --fg-3:#7a8b78;
  --accent:#457f23; --accent-2:#c27c0e; --accent-soft:#e9f3e1; --accent-ink:#ffffff;
  --btn-1:#4b8729; --btn-2:#68a43a; --orange-soft:#fcf1dc;
  --c3:#2f7fc1; --c4:#b4457f;
  --pe:#d9480f; --pe-2:#f0702a; --pe-head:#ccff99; --pe-tot:#d7f3ff;
  --grid-line:#cfd9c9; --emb-head:#3f7a22;
  --zebra:#f2f6ee; --row-hover:#e3efd8; --row-line:#c9d5c3; --pair-a:#e6f1dc; --pair-b:#fbefd6; --grp:#2f4a22; --grp-fg:#ffffff;
  --pos:#1d7a42; --pos-soft:#e0f3e7; --warn:#b5520a; --warn-soft:#fcebd9; --amb:#8a6a00; --amb-soft:#fbf0c4;
  --neg:#b3261e; --neg-soft:#fbe4e2; --info:#0b6688; --info-soft:#dcf0f7; --neu:#5a6b5c; --neu-soft:#e8ede6;
  --av-l:90%; --av-fg:32%;
  --scrim:rgba(16,24,18,.42);
  --sh-1:0 1px 2px rgba(28,42,31,.07),0 0 0 1px rgba(28,42,31,.05);
  --sh-2:0 10px 28px rgba(28,42,31,.13),0 2px 6px rgba(28,42,31,.06);
  --font:'Nunito Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --shell:#0d130f; --shell-2:#1c271f; --shell-fg:#eef2ec; --shell-dim:#93a594;
  --bg:#111712; --surface:#18201a; --surface-2:#1e2920; --line:#2b392d; --line-strong:#3e5040;
  --fg:#e8eee6; --fg-2:#adbcab; --fg-3:#80927e;
  --accent:#8ecb5c; --accent-2:#f2b54a; --accent-soft:#213320; --accent-ink:#0e1a08;
  --orange-soft:#3a2c12;
  --c3:#4b8fd6; --c4:#c75f95;
  --pe:#e8592a; --pe-2:#f5874a; --pe-head:#9fd86b; --pe-tot:#16323d;
  --grid-line:#2f3d31; --emb-head:#3f7a22;
  --zebra:#1c251e; --row-hover:#26361f; --row-line:#334235; --pair-a:#22331d; --pair-b:#382b14; --grp:#2a4020; --grp-fg:#eef2ec;
  --pos:#5fd38d; --pos-soft:#173828; --warn:#ff9f5c; --warn-soft:#3d2614; --amb:#f0cd5a; --amb-soft:#3a3214; --neg:#ff8a80; --neg-soft:#40201e; --info:#6fd0ef; --info-soft:#14323e; --neu:#adbcab; --neu-soft:#25312a;
  --av-l:26%; --av-fg:84%; --scrim:rgba(0,0,0,.55);
  --sh-1:0 1px 2px rgba(0,0,0,.3),0 0 0 1px rgba(255,255,255,.03);
  --sh-2:0 12px 32px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --shell:#0d130f; --shell-2:#1c271f; --shell-fg:#eef2ec; --shell-dim:#93a594;
  --bg:#111712; --surface:#18201a; --surface-2:#1e2920; --line:#2b392d; --line-strong:#3e5040;
  --fg:#e8eee6; --fg-2:#adbcab; --fg-3:#80927e;
  --accent:#8ecb5c; --accent-2:#f2b54a; --accent-soft:#213320; --accent-ink:#0e1a08;
  --orange-soft:#3a2c12;
  --c3:#4b8fd6; --c4:#c75f95;
  --pe:#e8592a; --pe-2:#f5874a; --pe-head:#9fd86b; --pe-tot:#16323d;
  --grid-line:#2f3d31; --emb-head:#3f7a22;
  --zebra:#1c251e; --row-hover:#26361f; --row-line:#334235; --pair-a:#22331d; --pair-b:#382b14; --grp:#2a4020; --grp-fg:#eef2ec;
  --pos:#5fd38d; --pos-soft:#173828; --warn:#ff9f5c; --warn-soft:#3d2614; --amb:#f0cd5a; --amb-soft:#3a3214; --neg:#ff8a80; --neg-soft:#40201e; --info:#6fd0ef; --info-soft:#14323e; --neu:#adbcab; --neu-soft:#25312a;
  --av-l:26%; --av-fg:84%; --scrim:rgba(0,0,0,.55);
  --sh-1:0 1px 2px rgba(0,0,0,.3),0 0 0 1px rgba(255,255,255,.03);
  --sh-2:0 12px 32px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3);
  color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:14px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--mono);font-size:.92em;letter-spacing:-.01em}
.dim{color:var(--fg-3)}
.num{font-variant-numeric:tabular-nums}
svg.i{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- app frame ---------- */
.app{height:100%;display:grid;grid-template-rows:minmax(0,1fr);grid-template-columns:252px minmax(0,1fr);grid-template-areas:"nav main"}
.app.mini,.app.auto-mini:not(.expand){grid-template-columns:64px minmax(0,1fr)}
.shell{grid-area:shell;background:var(--shell);color:var(--shell-fg);display:flex;align-items:center;gap:12px;height:58px;padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative;z-index:20}
.shell::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--brand-g) 0 38%,var(--brand-o) 38% 62%,transparent 100%)}
.sbtn{position:relative;overflow:hidden;width:40px;height:40px;border:0;border-radius:10px;background:transparent;color:var(--shell-fg);display:grid;place-items:center;cursor:pointer;transition:background .2s var(--ease),transform .2s var(--ease)}
.sbtn:hover{background:var(--shell-2)}
.sbtn:active{transform:scale(.94)}
.brand{display:flex;align-items:center;gap:10px;min-width:0;text-decoration:none;color:inherit}
.logo{height:38px;padding:5px 7px;border-radius:9px;background:#ffffff;display:flex;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.25);transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.logo img{height:28px;width:auto;display:block}
.brand:hover .logo{transform:translateY(-1px) rotate(-2deg);box-shadow:0 6px 18px rgba(234,168,55,.35)}
.brand .nm{display:flex;flex-direction:column;line-height:1.1}
.brand .nm b{font-size:16px;font-weight:800;white-space:nowrap}
.brand .nm small{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--brand-o);white-space:nowrap}
.ctx{display:flex;align-items:center;gap:8px;color:var(--shell-dim);font-size:13px;white-space:nowrap;padding-left:12px;margin-left:2px;border-left:1px solid var(--shell-2)}
.ssearch{flex:1;display:flex;justify-content:center;min-width:0}
.ssearch label{position:relative;width:min(460px,100%);display:block}
.ssearch input{width:100%;height:36px;border-radius:18px;border:1px solid transparent;background:var(--shell-2);color:var(--shell-fg);padding:0 14px 0 38px;transition:background .2s,border-color .2s,box-shadow .25s var(--ease)}
.ssearch input::placeholder{color:var(--shell-dim)}
.ssearch input:focus{outline:none;border-color:var(--brand-o);box-shadow:0 0 0 4px rgba(234,168,55,.2)}
.ssearch svg{position:absolute;left:12px;top:9px;color:var(--shell-dim)}
.sync{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--shell-dim);white-space:nowrap}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--brand-o);box-shadow:0 0 0 3px rgba(234,168,55,.2)}

.nav{grid-area:nav;width:252px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:14px 10px 14px max(10px,env(safe-area-inset-left,0px));overflow:hidden auto;overscroll-behavior:contain;contain:layout style;transition:width .22s var(--ease)}
.nav .grp{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-3);padding:14px 12px 6px;white-space:nowrap;transition:opacity .2s}
.nav a{position:relative;display:flex;align-items:center;gap:12px;height:42px;padding:0 12px;border-radius:10px;color:var(--fg-2);text-decoration:none;font-weight:600;white-space:nowrap;overflow:hidden;transition:background .2s var(--ease),color .2s}
.nav a::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--accent-soft),transparent);opacity:0;transform:translateX(-30%);transition:opacity .25s,transform .35s var(--ease)}
.nav a:hover::before{opacity:1;transform:none}
.nav a:hover{color:var(--fg)}
.nav a>*{position:relative}
.nav a.on{background:var(--accent-soft);color:var(--accent)}
.nav a.on::after{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:linear-gradient(var(--brand-g),var(--brand-o))}
.nav a .lbl{min-width:0;overflow:hidden;text-overflow:ellipsis}
.nav a .cnt{margin-left:auto;flex:none;font-size:12px;font-weight:700;color:var(--fg-3);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:0 7px;line-height:18px;font-variant-numeric:tabular-nums;transition:opacity .2s}
.nav a .cnt.hot{color:#2a1a00;background:var(--brand-o);border-color:transparent}
.nav a.on .cnt{color:var(--accent);border-color:transparent;background:var(--surface)}
.nav .foot{margin-top:auto;padding:12px;font-size:12px;color:var(--fg-3);white-space:nowrap;transition:opacity .2s}
.app.mini .nav,.app.auto-mini:not(.expand) .nav{width:64px}
.app.mini .nav .grp,.app.mini .nav .lbl,.app.mini .nav .cnt,.app.mini .nav .foot,.app.auto-mini:not(.expand) .nav .grp,.app.auto-mini:not(.expand) .nav .lbl,.app.auto-mini:not(.expand) .nav .cnt,.app.auto-mini:not(.expand) .nav .foot{opacity:0;pointer-events:none}
/* collapsed menu opens over the page on hover or keyboard focus (desktop) */
@media (min-width:901px) and (hover:hover){
  .nav{position:relative;z-index:25}
  .app.mini .nav:is(:hover,:focus-within),.app.auto-mini:not(.expand) .nav:is(:hover,:focus-within){width:292px;box-shadow:12px 0 32px -12px rgba(0,0,0,.28);transition:width .22s var(--ease) .1s,box-shadow .22s .1s}
  .app.mini .nav:is(:hover,:focus-within) :is(.grp,.lbl,.cnt,.foot),.app.auto-mini:not(.expand) .nav:is(:hover,:focus-within) :is(.grp,.lbl,.cnt,.foot){opacity:1;pointer-events:auto;transition:opacity .2s .2s}
  .app.mini .nav:is(:hover,:focus-within) .cnt[hidden],.app.auto-mini:not(.expand) .nav:is(:hover,:focus-within) .cnt[hidden]{display:none}
}
.page.full,.page.dash{max-width:none}
.scrim-nav{display:none}

.main{grid-area:main;overflow:auto;min-width:0}
.page{max-width:1480px;margin:0 auto;padding-block:24px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;animation:enter .45s var(--ease)}
@media (min-width:900px){.page{padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px))}}
@keyframes enter{from{opacity:.35;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- buttons ---------- */
.btn{position:relative;overflow:hidden;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:8px;height:38px;padding:0 16px;border-radius:9px;border:1px solid var(--line-strong);background:var(--surface);color:var(--accent);font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;transition:transform .22s var(--ease),box-shadow .25s var(--ease),border-color .2s,background-color .2s,color .2s,background-position .7s var(--ease)}
.btn:hover{transform:translateY(-2px);border-color:var(--accent);box-shadow:0 8px 18px -6px color-mix(in srgb,var(--brand-g) 45%,transparent)}
.btn:active{transform:translateY(0) scale(.97);transition-duration:.08s}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.emph{border:0;color:#ffffff;background:linear-gradient(115deg,var(--btn-1) 0%,var(--btn-2) 50%,var(--btn-1) 100%);background-size:220% 100%;background-position:0% 50%;box-shadow:0 4px 14px -6px color-mix(in srgb,var(--btn-1) 75%,transparent)}
.btn.emph:hover{background-position:100% 50%;box-shadow:0 12px 26px -8px color-mix(in srgb,var(--brand-o) 75%,transparent),0 0 0 2px color-mix(in srgb,var(--brand-o) 55%,transparent)}
.btn.emph::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(105deg,transparent 30%,rgba(255,255,255,.38) 50%,transparent 70%);transform:translateX(-130%);transition:transform .8s var(--ease)}
.btn.emph:hover::after{transform:translateX(130%)}
.btn.orange{border:0;color:#2a1a00;background:linear-gradient(115deg,#e09a22 0%,#f3c065 50%,#e09a22 100%);background-size:220% 100%;box-shadow:0 4px 14px -6px rgba(224,154,34,.8)}
.btn.orange:hover{background-position:100% 50%;box-shadow:0 12px 26px -8px rgba(224,154,34,.85)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--accent-soft);box-shadow:none}
.btn.danger{color:var(--neg)}
.btn.danger:hover{border-color:var(--neg);box-shadow:0 8px 18px -6px color-mix(in srgb,var(--neg) 40%,transparent)}
.btn.danger.emph{color:#fff;background:linear-gradient(115deg,#c2372e,#e0603a,#c2372e);background-size:220% 100%}
.btn.sm{height:32px;padding:0 12px;font-size:13px}
.ibtn{position:relative;overflow:hidden;width:34px;height:34px;border-radius:8px;border:0;background:transparent;color:var(--fg-2);display:inline-grid;place-items:center;cursor:pointer;transition:background .2s,color .2s,transform .2s var(--ease)}
.ibtn:hover{background:var(--accent-soft);color:var(--accent);transform:scale(1.08)}
.ibtn.del:hover{background:var(--neg-soft);color:var(--neg)}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.28;transform:scale(0);pointer-events:none;animation:ripple .65s var(--ease) forwards;z-index:0}
.btn.emph .ripple{background:#fff}
@keyframes ripple{to{transform:scale(1);opacity:0}}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- page header ---------- */
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.ph>div:first-child{min-width:0}
.crumb{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--fg-3);margin-bottom:6px;flex-wrap:wrap}
.crumb a{color:var(--accent);text-decoration:none;font-weight:600}
.crumb a:hover{text-decoration:underline}
.crumb svg{width:12px;height:12px}
h1{margin:0;font-size:clamp(22px,2.4vw,28px);line-height:1.15;font-weight:800;letter-spacing:-.01em;text-wrap:balance;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1 .tot{font-size:15px;font-weight:700;color:var(--fg-3);font-variant-numeric:tabular-nums}
.ph p{margin:6px 0 0;color:var(--fg-2);max-width:70ch}
.ph .acts{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.card{background:var(--surface);border-radius:14px;box-shadow:var(--sh-1)}
.refd{display:flex;flex-direction:column;gap:4px}
.refd label{font-size:12px;font-weight:700;color:var(--fg-2)}
.refd .row{display:flex;gap:6px}
.refd .in{width:160px}

/* ---------- filter bar ---------- */
.fbar{padding:14px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
.fbar .fld{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1 1 140px;max-width:240px}
.fbar .fld.grow{flex:2 1 200px;max-width:320px}
.fbar label{font-size:12px;font-weight:700;color:var(--fg-2)}
.fbar .end{margin-left:auto;display:flex;gap:8px}
.in,.sel select{width:100%;height:38px;border:1px solid var(--line-strong);border-radius:9px;background:var(--surface);padding:0 12px;transition:border-color .2s,box-shadow .25s var(--ease),background .2s}
.in:hover,.sel select:hover{border-color:var(--fg-3)}
.in:focus,.sel select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.in::placeholder{color:var(--fg-3)}
.sel{position:relative;display:block}
.sel select{appearance:none;-webkit-appearance:none;padding-right:34px;cursor:pointer;text-overflow:ellipsis}
.sel svg{position:absolute;right:10px;top:10px;width:16px;height:16px;color:var(--fg-3);pointer-events:none;transform:rotate(90deg)}
.srch{position:relative;display:block}
.srch .in{padding-left:36px}
.srch svg{position:absolute;left:11px;top:10px;width:17px;height:17px;color:var(--fg-3)}
textarea.in{height:auto;min-height:84px;padding:10px 12px;resize:vertical}

/* ---------- table ---------- */
.tcard{overflow:hidden}
.tbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tbar h2{margin:0;font-size:15px;font-weight:800;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tbar h2 span{color:var(--fg-3);font-weight:700}
.tbar .hint{font-size:12.5px;color:var(--fg-3)}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 6px 0 12px;border-radius:14px;background:var(--orange-soft);color:var(--fg);font-size:12.5px;font-weight:700;border:0;cursor:pointer;transition:background .2s}
.chip svg{width:14px;height:14px}
.chip:hover{background:color-mix(in srgb,var(--brand-o) 35%,var(--surface))}
.tscroll{overflow:auto;max-height:calc(100vh - 160px)}
table{width:100%;border-collapse:separate;border-spacing:0;min-width:820px}
table.wide{min-width:1520px}
th{position:sticky;top:0;z-index:2;background:var(--surface-2);text-align:left;font-size:12px;font-weight:700;color:var(--fg-2);letter-spacing:.02em;padding:0;border-bottom:1px solid var(--line);white-space:nowrap}
th button{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:6px;width:100%;padding:11px 12px;cursor:pointer;transition:color .2s}
th button:hover{color:var(--accent)}
th button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
th button svg{width:14px;height:14px;opacity:.35;transition:opacity .2s,transform .25s var(--ease)}
th.sorted button{color:var(--accent)}
th.sorted button svg{opacity:1}
th.desc button svg{transform:rotate(180deg)}
th.r,td.r{text-align:right}
th.r button{justify-content:flex-end}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer;transition:background .18s}
tbody tr:hover{background:color-mix(in srgb,var(--accent-soft) 70%,transparent)}
tbody tr:last-child td{border-bottom:0}
tbody tr.anim{animation:rowin .4s var(--ease) both}
@keyframes rowin{from{opacity:.3;transform:translateY(4px)}}
td.acts{width:1%;white-space:nowrap;text-align:right;padding:6px 10px}
td.acts .ibtn{opacity:.55}
tbody tr:hover td.acts .ibtn{opacity:1}
td b{font-weight:700}
.person{display:flex;align-items:center;gap:11px;min-width:0}
.person div{display:flex;flex-direction:column;min-width:0}
.person small{color:var(--fg-3);font-size:12px}
.person div{min-width:160px}
.person b{line-height:1.25}
.av{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:12.5px;font-weight:800;background:hsl(var(--h) 55% var(--av-l));color:hsl(var(--h) 50% var(--av-fg))}
.ref{display:flex;flex-direction:column}
.ct2{display:flex;flex-direction:column;max-width:170px;min-width:0}
.cqw{container-type:inline-size}
table.fit{min-width:0;table-layout:fixed}

/* embarque grid */

.gh span{font-size:12.5px;color:var(--fg-2)}

td.nm b{display:block;white-space:nowrap}
td.nm small{font-size:11.5px;font-weight:700;color:var(--warn)}
td.obs{max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--fg-2);font-size:13px}
td.bk{white-space:nowrap;font-size:12.5px;color:var(--fg-2)}

td.dt{white-space:nowrap}
.cell-in{height:30px;border:1px solid transparent;background:transparent;border-radius:7px;padding:0 6px;font-family:var(--mono);font-size:13px;transition:border-color .2s,background .2s,box-shadow .2s;cursor:text}
.cell-in:hover{border-color:var(--line-strong);background:var(--surface)}

.cell-in.n{width:52px;text-align:right}

.mv{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:800;margin-left:6px;padding:2px 7px;border-radius:6px}
.mv.up{color:var(--pos);background:var(--pos-soft)}

/* boarding control: spreadsheet-style header */

/* side menu head (logo) and foot (collapse) now that the top bar is gone */
.nlogo{display:flex!important;align-items:center;gap:10px;height:auto!important;padding:4px 2px 14px!important;margin-bottom:6px;border-bottom:1px solid var(--line);border-radius:0!important}

/* boarding table grid lines */
table.emb{border-left:1px solid var(--grid-line)}

/* boarding table header: centered, strong brand green */
table.emb thead th{background:var(--emb-head);color:#fff;border-right-color:rgba(255,255,255,.22);border-bottom:0}
table.emb thead th{white-space:normal}
table.emb thead th button{justify-content:center;text-align:center;color:#fff;font-weight:800;letter-spacing:.03em;text-transform:uppercase;font-size:11px;line-height:1.15;padding:6px 4px;height:auto;min-height:38px}

table.emb thead th.sorted button{color:#fff;background:rgba(0,0,0,.14)}
table.emb thead th.sorted button svg{opacity:1;color:var(--brand-o)}

/* column filter buttons + popover */
table.emb thead .thw{display:flex;align-items:stretch;min-height:38px}
table.emb thead .thw .ths{flex:1;min-width:0;padding:6px 2px 6px 4px}

table.emb thead .thw .thf{flex:none;align-self:center;width:18px;height:18px;min-height:0;margin-right:3px;padding:0;border-radius:4px;display:grid;place-items:center;background:rgba(255,255,255,.16);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);cursor:pointer;transition:background .2s,transform .2s var(--ease)}

table.emb thead .thw .thf:focus-visible{outline:2px solid #fff;outline-offset:1px}
.cfpop{position:fixed;z-index:66;width:300px;max-width:calc(100vw - 16px);background:var(--surface);border-radius:14px;box-shadow:var(--sh-2),0 0 0 1px var(--line);padding:10px;display:flex;flex-direction:column;gap:6px;animation:apin .2s var(--ease)}

.cfh span{font-size:11.5px;color:var(--fg-3)}
.cfs{display:flex;flex-direction:column}

.cfl{max-height:min(280px,40vh);overflow:auto;border:1px solid var(--line);border-radius:9px;padding:4px}
.cfl label{display:grid;grid-template-columns:18px minmax(0,1fr) auto;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;font-size:12.5px;cursor:pointer}

.cft.l1{padding-left:18px}.cft.l2{padding-left:36px}

.chip.cfchip{background:color-mix(in srgb,var(--brand-o) 30%,var(--surface))}

.pgsum{display:grid;grid-template-columns:1.6fr 1fr 1fr 1.2fr;gap:10px;margin:14px 0 4px;padding:12px;border-radius:12px;background:var(--surface-2)}

.ferbox{border-radius:12px;background:var(--surface-2);padding:14px;display:flex;flex-direction:column;gap:12px}

.fbh{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.fbe{font-size:12px;color:var(--fg-3);font-weight:600}
.fbg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 14px}
.fbg div{display:flex;flex-direction:column;gap:2px;min-width:0}.fbg .w2{grid-column:span 1}.fbg .w3{grid-column:1/-1}
.fbg span{font-size:11px;font-weight:700;color:var(--fg-3);text-transform:uppercase;letter-spacing:.05em}
.fbg b{font:700 13.5px var(--mono)}.fbg b.big{font-size:22px;line-height:1.1;font-family:var(--font);font-weight:800}.fbg b.sm{font-family:var(--font);font-size:13.5px}
.fbg small{font-size:11.5px;color:var(--fg-3)}.fbg .neg b,.fbg .neg small{color:var(--neg)}.fbg .warn b,.fbg .warn small{color:var(--warn)}
.fbn{margin:0;font-size:12px;color:var(--fg-3);line-height:1.45}
@media (max-width:560px){.fbg{grid-template-columns:repeat(2,minmax(0,1fr))}.pgsum{grid-template-columns:1fr 1fr}.pform3.c3{grid-template-columns:1fr}}
.matl{display:flex;flex-direction:column;gap:2px;margin:6px 0 2px;max-height:150px;overflow:auto;padding:6px 10px;border-radius:8px;background:var(--surface-2);font-size:12.5px}
.matl i{font-style:normal;color:var(--fg-3)}.matl span{color:var(--fg-2)}
.optabs{display:flex;gap:4px;padding:0 max(20px,env(safe-area-inset-right,0px)) 0 22px;background:var(--surface);border-bottom:1px solid var(--line)}
.optabs button{position:relative;border:0;background:transparent;font:inherit;font-weight:700;font-size:13.5px;color:var(--fg-2);padding:12px 14px;cursor:pointer;transition:color .2s}
.optabs button span{font:600 11px var(--mono);color:var(--fg-3);background:var(--surface-2);border-radius:8px;padding:1px 6px;margin-left:4px}
.optabs button::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:3px;border-radius:3px 3px 0 0;background:linear-gradient(90deg,var(--brand-g),var(--brand-o));transform:scaleX(0);transition:transform .3s var(--ease)}
.optabs button.on{color:var(--accent)}
.optabs button.on::after{transform:scaleX(1)}
.optabs button:hover{color:var(--fg)}
.hsum .cyc{margin-bottom:10px}
.hnext{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.hnext>span{font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-3);margin-right:4px}
.hnext em{display:inline-flex;align-items:center;gap:4px;font-style:normal;font-size:12px;font-weight:700;border-radius:6px;padding:3px 8px}
.hnext em svg{width:13px;height:13px}
.hnext em.emb{color:var(--pos);background:var(--pos-soft)}
.hnext em.des{color:var(--warn);background:var(--warn-soft)}
.hnext em.none{color:var(--fg-3);background:var(--surface-2)}
.hfil{display:flex;flex-wrap:wrap;gap:6px}
.hfil button{border:1px solid var(--line);background:var(--surface);font:inherit;font-size:12.5px;font-weight:700;color:var(--fg-2);padding:6px 11px;border-radius:18px;cursor:pointer;transition:background .2s,color .2s,border-color .2s}
.hfil button span{font:600 11px var(--mono);color:var(--fg-3);margin-left:3px}
.hfil button:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.hfil button.on{background:linear-gradient(115deg,var(--btn-1),var(--btn-2));border-color:transparent;color:#fff}
.hfil button.on span{color:rgba(255,255,255,.8)}
.hfil button:disabled{opacity:.45;cursor:default}
.hlist{display:flex;flex-direction:column;gap:14px}
.hg h5{margin:0 0 8px;font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3)}
.hg>ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;position:relative}
.hg>ul::before{content:"";position:absolute;left:15px;top:6px;bottom:6px;width:2px;background:var(--line)}
.hi{position:relative;display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;animation:rowin .35s var(--ease) both}
.hdot{position:relative;z-index:1;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--surface);color:var(--hc);box-shadow:0 0 0 2px var(--hc) inset}
.hdot svg{width:15px;height:15px}
.hdot i{display:grid;place-items:center;min-width:24px;height:18px;border-radius:4px;font:800 9.5px var(--mono);font-style:normal;background:var(--cb);color:var(--cf)}
.hb2{background:var(--surface);border-radius:10px;box-shadow:var(--sh-1);padding:10px 12px;min-width:0}
.hh{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.hh b{font-size:13px}
.htag{flex:none;font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--hc)}
.hb2 p{margin:4px 0 0;font-size:12.5px;color:var(--fg-2);overflow-wrap:anywhere}
.hb2 small{display:block;margin-top:6px;font-size:11.5px;color:var(--fg-3)}
.hb2 small a{color:var(--accent);font-weight:700;text-decoration:none}
.hb2 small a:hover{text-decoration:underline}
.hch{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:3px}
.hch li{display:grid;grid-template-columns:116px max-content 14px max-content;align-items:center;gap:6px;font-size:12.5px}
.hch li span{color:var(--fg-3);font-weight:600}
.hch li s{color:var(--fg-3);font-family:var(--mono);font-size:12px}
.hch li svg{width:13px;height:13px;color:var(--fg-3)}
.hch li b{font-family:var(--mono);font-size:12px;color:var(--fg)}
@media (max-width:640px){.hch li{grid-template-columns:1fr;gap:0}.hch li svg{display:none}}

/* update status: flag set by ADM, banner under EFETIVO */
.sheethd{grid-template-columns:auto minmax(0,1fr) auto}
.sh-mid{display:flex;flex-direction:column;align-items:center;gap:10px;min-width:0}
.ustat{display:inline-flex;align-items:center;gap:10px;padding:8px 20px;border-radius:12px;font:800 clamp(16px,2vw,22px)/1.1 'Roboto Condensed','Arial Narrow',Arial,sans-serif;letter-spacing:.06em;text-transform:uppercase;text-align:center;animation:shin .5s var(--ease) both}
.ustat svg{width:24px;height:24px;flex:none;stroke-width:2.4}
.ustat.go{color:#fff;background:linear-gradient(115deg,#d9480f,#f08c00,#d9480f);background-size:220% 100%;box-shadow:0 6px 22px -6px rgba(217,72,15,.65);animation:shin .5s var(--ease) both,ugrad 2.4s linear infinite,upulse 1.6s ease-in-out infinite}
.ustat.go svg{animation:spin 1.4s linear infinite}
.ustat.ok{color:#fff;background:linear-gradient(115deg,var(--btn-1),var(--btn-2));box-shadow:0 6px 22px -8px color-mix(in srgb,var(--btn-1) 80%,transparent)}
@keyframes ugrad{to{background-position:-220% 50%}}
@keyframes upulse{50%{box-shadow:0 0 0 8px rgba(240,140,0,0),0 6px 22px -6px rgba(217,72,15,.65);transform:scale(1.02)}}
.ustat-t{font-size:12px;color:var(--fg-3);margin-top:-4px}
.uflag{display:flex;flex-direction:column;align-items:flex-end;gap:6px;padding:10px 12px;border-radius:12px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.uflag>span{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--fg-3)}
.uflag .switch{min-height:30px;font-size:13px}
.uflag.on{background:color-mix(in srgb,#f08c00 14%,var(--surface));box-shadow:inset 0 0 0 1.5px #f08c00}
.uflag.on .switch input:checked+.tr{background:linear-gradient(90deg,#d9480f,#f08c00)}
@media (max-width:900px){.sheethd{grid-template-columns:minmax(0,1fr)}.sh-left{justify-content:center}.uflag{align-items:center}}
@media (prefers-reduced-motion:reduce){.ustat.go,.ustat.go svg{animation:none}}


/* data labels */
.ch .dl{font:700 10.5px var(--mono);fill:var(--fg);paint-order:stroke;stroke:var(--surface);stroke-width:3px;stroke-linejoin:round;animation:fadein .4s ease both}
.ch .dl.dlt{font-size:12px;font-weight:800}
.ch .bvl{font:700 10.5px var(--mono);fill:var(--fg-2);animation:fadein .4s ease both}
.ch .vl.vlc{fill:var(--fg);font-weight:800}
.donut .dpl{font:800 11px var(--font);fill:#fff;pointer-events:none;animation:fadein .4s ease both}
.hc{flex-direction:column;justify-content:space-between;align-items:stretch}
.hc span{align-self:flex-end}
.hc .hv{align-self:flex-start;font:800 12px var(--mono);line-height:1;color:inherit}
.hc.hl1 .hv,.hc.hl2 .hv,.hc.hl3 .hv{color:var(--fg)}

/* status (ObjectStatus) */
.st{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;letter-spacing:.02em;border-radius:20px;padding:3px 10px 3px 8px;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st.pos{color:var(--pos);background:var(--pos-soft)}
.st.warn{color:var(--warn);background:var(--warn-soft)}
.st.neg{color:var(--neg);background:var(--neg-soft)}
.st.info{color:var(--info);background:var(--info-soft)}
.st.neu{color:var(--neu);background:var(--neu-soft)}
.st.dash{color:var(--fg-3);background:transparent;box-shadow:inset 0 0 0 1px var(--line-strong)}
.tag{display:inline-block;font-family:var(--mono);font-size:11.5px;font-weight:600;border-radius:6px;padding:2px 7px;border:1px solid var(--line-strong);color:var(--fg-2);white-space:nowrap}
.tag.mod{border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent);background:var(--accent-soft)}
.tag.moi,.tag.o{border-color:color-mix(in srgb,var(--accent-2) 50%,transparent);color:var(--accent-2);background:var(--orange-soft)}

/* empty */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:48px 20px 52px}
.empty .ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;color:var(--accent);background:radial-gradient(circle at 30% 30%,var(--surface),var(--accent-soft));box-shadow:0 0 0 8px var(--orange-soft)}
.empty .ic svg{width:28px;height:28px}
.empty h3{margin:6px 0 0;font-size:17px;font-weight:800}
.empty p{margin:0;color:var(--fg-2);max-width:46ch}
.empty .btn{margin-top:8px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpis.k5{grid-template-columns:repeat(5,minmax(0,1fr))}
.kpi{padding:16px 18px;display:flex;flex-direction:column;gap:4px;text-align:left;border:0;font:inherit;color:inherit}
.kpi span{font-size:12.5px;font-weight:700;color:var(--fg-2);display:flex;align-items:center;gap:7px}
.kpi span i{width:9px;height:9px;border-radius:50%}
.kpi b{font-size:30px;line-height:1.1;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi small{color:var(--fg-3);font-size:12.5px}
button.kpi{cursor:pointer;position:relative;overflow:hidden;transition:transform .25s var(--ease),box-shadow .25s var(--ease)}
button.kpi:hover{transform:translateY(-3px);box-shadow:var(--sh-2)}
button.kpi.on{box-shadow:0 0 0 2px var(--accent),var(--sh-2)}
button.kpi.on::after{content:"Filtro ativo";position:absolute;top:12px;right:12px;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}

/* days strip */
.days-c{padding:16px 16px 14px}
.days-c .hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.days-c h3{margin:0;font-size:15px;font-weight:800}
.days-c .hd small{color:var(--fg-3);font-size:12.5px}
.days{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(96px,1fr);gap:8px;overflow-x:auto;padding:2px 2px 6px}
.day{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:6px;padding:10px 10px 9px;border-radius:11px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;text-align:left;font:inherit;color:inherit;transition:transform .22s var(--ease),border-color .2s,box-shadow .25s var(--ease),background .2s}
.day:hover{transform:translateY(-2px);border-color:var(--brand-o);box-shadow:0 8px 18px -10px rgba(234,168,55,.9)}
.day .dw{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}
.day .dd{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums}
.day .ct{display:flex;gap:8px;font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums}
.day .ct .u{color:var(--pos)}.day .ct .d{color:var(--warn)}
.day .ct .z{color:var(--fg-3);font-weight:600}
.day.today{background:var(--surface);border-color:var(--brand-g)}
.day.today .dw{color:var(--accent)}
.day.on{background:linear-gradient(135deg,var(--btn-1),var(--btn-2));border-color:transparent;color:#fff}
.day.on .dw,.day.on .ct .u,.day.on .ct .d,.day.on .ct .z{color:#fff}
.days-leg{display:flex;gap:14px;font-size:12px;color:var(--fg-3);margin-top:8px}
.days-leg b.u{color:var(--pos)}.days-leg b.d{color:var(--warn)}

/* ---------- home ---------- */
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.hero .eyebrow{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-2)}
.hero h1{margin-top:4px}
.hero p{margin:6px 0 0;color:var(--fg-2)}
.sec-t{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:6px 0 -4px}
.sec-t h2{margin:0;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-2)}
.opb{position:relative;isolation:isolate;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center;padding:22px 24px;border-radius:16px;background:var(--shell);color:var(--shell-fg);text-decoration:none;box-shadow:var(--sh-2);transition:transform .3s var(--ease)}
.opb::before{content:"";position:absolute;z-index:-1;inset:auto -60px -120px auto;width:340px;height:340px;border-radius:50%;background:radial-gradient(circle,rgba(234,168,55,.35),transparent 65%);transition:transform .6s var(--ease)}
.opb::after{content:"";position:absolute;z-index:-1;left:0;top:0;bottom:0;width:5px;background:linear-gradient(var(--brand-g),var(--brand-o))}
.opb:hover{transform:translateY(-3px)}
.opb:hover::before{transform:scale(1.25)}
.opb small{font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--brand-o)}
.opb h3{margin:4px 0 6px;font-size:21px;font-weight:800}
.opb .nums{display:flex;gap:22px;flex-wrap:wrap;margin-top:10px}
.opb .nums div{display:flex;flex-direction:column}
.opb .nums b{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.opb .nums span{font-size:12px;color:var(--shell-dim)}
.opb .go{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border-radius:10px;font-weight:800;color:#2a1a00;background:linear-gradient(115deg,#e09a22,#f3c065,#e09a22);background-size:220% 100%;transition:background-position .7s var(--ease),transform .25s var(--ease)}
.opb:hover .go{background-position:100% 50%;transform:translateX(3px)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.tile{position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;gap:6px;min-height:164px;padding:18px;border-radius:14px;background:var(--surface);box-shadow:var(--sh-1);text-decoration:none;color:inherit;cursor:pointer;transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.tile::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;padding:1.5px;background:linear-gradient(135deg,var(--brand-g),var(--brand-o) 45%,transparent 75%);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .3s}
.tile::after{content:"";position:absolute;z-index:-2;width:220px;height:220px;right:-80px;top:-90px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--brand-o) 26%,transparent),transparent 70%);transform:scale(.6);opacity:0;transition:transform .5s var(--ease),opacity .4s}
.tile:hover{transform:translateY(-4px);box-shadow:var(--sh-2)}
.tile:hover::before{opacity:1}
.tile:hover::after{transform:scale(1);opacity:1}
.tile .ti{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:var(--accent);background:var(--accent-soft);transition:transform .35s var(--ease),background .3s,color .3s}
.tile:hover .ti{transform:rotate(-6deg) scale(1.06);background:linear-gradient(135deg,var(--btn-1),var(--btn-2));color:#ffffff}
.tile h3{margin:6px 0 0;font-size:16px;font-weight:800}
.tile p{margin:0;font-size:13px;color:var(--fg-2)}
.tile .bot{margin-top:auto;display:flex;align-items:flex-end;justify-content:space-between;gap:8px}
.tile .bot b{font-size:32px;line-height:1;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.tile .bot small{display:block;font-size:12px;color:var(--fg-3);margin-top:4px}
.tile .add{position:relative;overflow:hidden;width:36px;height:36px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);color:var(--accent);display:grid;place-items:center;cursor:pointer;transition:transform .3s var(--ease),background .25s,color .25s,border-color .25s}
.tile .add:hover{transform:rotate(90deg);background:var(--btn-1);color:#fff;border-color:var(--btn-1)}
.duo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.panel-c{padding:18px}
.panel-c h3{margin:0 0 2px;font-size:15px;font-weight:800}
.panel-c>p{margin:0 0 14px;font-size:13px;color:var(--fg-3)}
.bars{display:flex;flex-direction:column;gap:14px}
.bar-row{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 92px;align-items:center;gap:12px}
.bar-row .nm{display:flex;flex-direction:column;min-width:0}
.bar-row .nm b{font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-row .nm small{font-family:var(--mono);font-size:11.5px;color:var(--fg-3)}
.track{display:flex;height:12px;border-radius:6px;background:var(--surface-2);overflow:hidden;box-shadow:inset 0 0 0 1px var(--line)}
.track i{display:block;height:100%;transform-origin:left;animation:grow .9s var(--ease) both}
.track i.e{background:linear-gradient(90deg,var(--btn-1),var(--btn-2))}
.track i.d{background:color-mix(in srgb,var(--brand-o) 70%,var(--surface))}
@keyframes grow{from{transform:scaleX(.08)}}
.bar-row .v{text-align:right;font-weight:800;font-variant-numeric:tabular-nums;font-size:13px}
.bar-row .v span{color:var(--fg-3);font-weight:600}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;font-size:12.5px;color:var(--fg-2)}
.legend span{display:flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:3px}

/* ---------- object panel ---------- */

.op.on{transform:none}
.op-h{display:flex;align-items:flex-start;gap:14px;padding:20px max(20px,env(safe-area-inset-right,0px)) 18px 22px;background:var(--surface);border-bottom:1px solid var(--line)}
.op-h .ti{width:46px;height:46px;flex:none;border-radius:12px;display:grid;place-items:center;color:#ffffff;background:linear-gradient(135deg,var(--btn-1),var(--btn-2));box-shadow:0 0 0 3px var(--orange-soft)}

.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.span2{grid-column:1/-1}
.field>label{font-size:12.5px;font-weight:700;color:var(--fg-2)}
.field .req{color:var(--neg);margin-left:3px}

.field.bad .in,.field.bad .sel select{border-color:var(--neg);box-shadow:0 0 0 3px color-mix(in srgb,var(--neg) 14%,transparent)}
.field.bad{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.cyc{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;background:var(--surface-2);border-radius:10px;padding:12px}
.cyc div{display:flex;flex-direction:column;gap:3px;min-width:0}
.cyc span{font-size:11.5px;font-weight:700;color:var(--fg-3);text-transform:uppercase;letter-spacing:.05em}

.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:700;color:var(--fg-2);user-select:none;min-height:38px}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .tr{width:44px;height:24px;flex:none;border-radius:12px;background:var(--line-strong);position:relative;transition:background .3s var(--ease)}
.switch .tr::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .3s var(--ease)}
.switch input:checked+.tr{background:linear-gradient(90deg,var(--btn-1),var(--btn-2))}

.switch input:focus-visible+.tr{outline:2px solid var(--accent);outline-offset:2px}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;max-height:220px;overflow:auto}
.hist li{display:flex;gap:10px;font-size:13px}
.hist li::before{content:"";flex:none;width:8px;height:8px;margin-top:6px;border-radius:50%;background:var(--brand-o)}
.hist small{display:block;color:var(--fg-3);font-size:11.5px}
.meta{font-size:12px;color:var(--fg-3);display:flex;gap:16px;flex-wrap:wrap;padding:0 4px}

/* dialog + toast */
.dlg{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:16px;pointer-events:none}

.dlg.on .box{opacity:1;transform:none}
.dlg .dh{display:flex;gap:12px;align-items:flex-start}
.dlg .dh .ic{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--neg-soft);color:var(--neg)}

.dlg .dh.ok .ic{background:var(--accent-soft);color:var(--accent)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:70;transform:translate(-50%,20px);opacity:0;display:flex;align-items:center;gap:10px;max-width:calc(100% - 32px);padding:12px 18px;border-radius:12px;background:var(--shell);color:var(--shell-fg);font-weight:600;box-shadow:var(--sh-2);transition:opacity .3s var(--ease),transform .35s var(--ease);pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast svg{color:#7fd35a}

/* ---------- responsive ---------- */
@media (max-width:1180px){.kpis.k5{grid-template-columns:repeat(3,minmax(0,1fr))}}

  .app{grid-template-areas:"main main"}

  .opb{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .ssearch{display:none}
  .shell{justify-content:space-between}
  .kpis,.kpis.k5{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi b{font-size:24px}
  .tiles{grid-template-columns:minmax(0,1fr)}
  .tile{min-height:140px}
  .fbar .fld,.fbar .fld.grow{max-width:none;flex-basis:100%}

  .fgrid,.cyc{grid-template-columns:minmax(0,1fr)}
  .bar-row{grid-template-columns:minmax(0,90px) minmax(0,1fr) 80px}
  .ph .acts{width:100%}
  .mvlist li{grid-template-columns:90px minmax(0,1fr)}
  .mvlist a{grid-column:1/-1}
}
/* ---------- rotas ---------- */
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.fold{position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:flex-start;gap:3px;padding:18px 18px 16px;border:0;border-radius:16px;background:var(--surface);box-shadow:var(--sh-1);cursor:pointer;text-align:left;font:inherit;color:inherit;overflow:hidden;animation:rowin .45s var(--ease) both;transition:transform .3s var(--ease),box-shadow .3s var(--ease)}

.fold .fd{width:58px;height:48px;margin-bottom:8px;overflow:visible}

.pv{font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--accent-2);background:var(--orange-soft);border-radius:6px;padding:1px 6px}

.dfolders{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}

.dfold::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--brand-g),var(--brand-o));opacity:.0;transition:opacity .25s}

.dfold:hover::before{opacity:1}

.rnote{display:flex;align-items:center;gap:8px;margin:0;font-size:12.5px;color:var(--fg-2)}

.seg{display:inline-flex;background:var(--surface);border-radius:11px;padding:4px;box-shadow:var(--sh-1);gap:2px;flex-wrap:wrap}

/* report paper: mirrors the Programação sheet */

tr.rs td{background:var(--surface-2);color:var(--fg);padding:8px;border-bottom:1px solid var(--rep-line)}

table.mvt .dst{display:block;font-size:10.5px;color:var(--info);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
table.mvt tr.rea td{opacity:.6}
table.mvt td.x{padding:0 6px;overflow:visible}
table.mvt td{padding:6px 6px}
.rea-b{height:28px;padding:0 10px;font-size:12px}
.sair-b{opacity:.45}
tr:hover .sair-b{opacity:1}
.sair-b:hover{background:var(--neg-soft)!important;color:var(--neg)!important}
.panel-out{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--warn-soft);font-size:13px}
.panel-out svg{color:var(--warn)}
@media (max-width:640px){.mvopts{grid-template-columns:1fr}}

/* ---------- dashboard ---------- */
.dash{gap:16px}
.dhero{position:relative;isolation:isolate;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;padding:26px 28px;border-radius:20px;background:var(--shell);color:var(--shell-fg);box-shadow:var(--sh-2)}
.dhero::before{content:"";position:absolute;z-index:-1;width:520px;height:520px;right:-140px;top:-260px;border-radius:50%;background:radial-gradient(circle,rgba(234,168,55,.30),transparent 62%);animation:glow 9s ease-in-out infinite alternate}
.dhero::after{content:"";position:absolute;z-index:-1;width:460px;height:460px;left:-180px;bottom:-300px;border-radius:50%;background:radial-gradient(circle,rgba(97,153,53,.38),transparent 62%);animation:glow 11s ease-in-out infinite alternate-reverse}
@keyframes glow{to{transform:translate(-60px,40px) scale(1.15)}}
.dh-l .eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--brand-o)}
.dh-l h1{color:#fff;margin-top:6px;font-size:clamp(26px,3vw,34px)}
.dh-l p{margin:6px 0 0;color:var(--shell-dim)}
.dh-l #dclock{color:#fff;font-weight:600}
.dchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.dchip{display:inline-flex;align-items:baseline;gap:6px;padding:7px 12px;border-radius:10px;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);color:var(--shell-dim);font-size:12.5px;text-decoration:none;transition:background .25s,transform .25s var(--ease)}
.dchip b{font-size:16px;color:#fff;font-variant-numeric:tabular-nums}
a.dchip:hover{background:rgba(255,255,255,.14);transform:translateY(-2px)}
.dchip.hot{background:rgba(234,168,55,.18);box-shadow:inset 0 0 0 1px rgba(234,168,55,.5)}
.dchip.hot b{color:#ffcf7a}
.dh-r{display:flex;align-items:center;gap:18px}
.bigring{width:132px;height:132px}
.ring.big{width:132px;height:132px}
.ring.big .rtrack{stroke:rgba(255,255,255,.1)}
.ring.big .rpct{fill:#fff;font-size:22px}
.bigtxt{display:flex;flex-direction:column}
.bigtxt small{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--shell-dim)}
.bigtxt b{font-size:54px;line-height:1;font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;background:linear-gradient(120deg,#9be06f,#f3c065);-webkit-background-clip:text;background-clip:text;color:transparent}
.bigtxt span{font-size:13px;color:var(--shell-dim)}
.dfil{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px;padding:12px 16px}
.dfil .fg{display:flex;flex-direction:column;gap:5px}
.dfil .fg>span,.dfil .fg>label{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}
.dfil .sel select{height:40px;min-width:240px;max-width:340px}
.dfil .seg{box-shadow:inset 0 0 0 1px var(--line)}
.dupd{margin-left:auto;font-size:12px;color:var(--fg-3);align-self:center}
.dk-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.dk{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) 120px;grid-template-rows:auto auto auto;column-gap:10px;padding:16px 18px;border:0;text-align:left;font:inherit;color:inherit;cursor:pointer;animation:rowin .5s var(--ease) both;transition:transform .3s var(--ease),box-shadow .3s var(--ease)}
.dk:nth-child(2){animation-delay:60ms}.dk:nth-child(3){animation-delay:120ms}.dk:nth-child(4){animation-delay:180ms}
.dk:hover{transform:translateY(-4px);box-shadow:var(--sh-2)}
.dk::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--brand-g),var(--brand-o));transform:scaleX(0);transform-origin:left;transition:transform .45s var(--ease)}
.dk:hover::after{transform:scaleX(1)}
.dkl{grid-column:1/-1;display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--fg-2)}
.dkl i{width:9px;height:9px;border-radius:50%}
.dk>b{font-size:34px;line-height:1.15;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.dk>small{grid-column:1;font-size:12px;color:var(--fg-3)}
.dks{grid-column:2;grid-row:2/4;align-self:end}
.spk{width:120px;height:40px;display:block;overflow:visible}
.spk .ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.2s var(--ease) .2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.dgrid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.dcard{padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0;animation:rowin .55s var(--ease) both}
.s4{grid-column:span 4}.s5{grid-column:span 5}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.dch{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.dch h3{margin:0;font-size:15px;font-weight:800}
.dch p{margin:2px 0 0;font-size:12.5px;color:var(--fg-3)}
.dleg,.hleg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--fg-2);align-items:center}
.dleg span{display:inline-flex;align-items:center;gap:6px}
.dleg i{width:12px;height:12px;border-radius:3px}
.dleg i.dl2{height:0;border-top:2px dashed;border-radius:0;width:16px}
.lnk{font-size:12.5px;font-weight:700;color:var(--accent);text-decoration:none}
.lnk:hover{text-decoration:underline}
.ch{width:100%;height:auto;display:block;overflow:visible}
.ch .gl{stroke:var(--line);stroke-width:1}
.ch .ax{font:500 11px var(--font);fill:var(--fg-3)}
.ch .ax2{font:500 9.5px var(--font);fill:var(--fg-3);text-transform:capitalize}
.ch .axh{fill:var(--accent);font-weight:800}
.ch .vl{font:700 11px var(--mono);fill:var(--fg-2)}
.ch .ln{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s var(--ease) forwards}
.ch .ln.dsh{stroke-dasharray:7 5;stroke-dashoffset:0;animation:fadein .8s ease .6s both;stroke-width:2}
.ch .ar{animation:fadein 1s ease .5s both}
@keyframes fadein{from{opacity:0}}
.ch .ldot,.ch .tdot{animation:fadein .4s ease 1.3s both;stroke:var(--surface);stroke-width:2}
.ch .tdl{stroke:var(--brand-o);stroke-width:1.5;stroke-dasharray:4 4}
.ch .tdt{font:800 10px var(--font);fill:var(--accent-2);letter-spacing:.06em}
.ch .xhl{stroke:var(--fg-3);stroke-width:1}
.ch .xhd{stroke:var(--surface);stroke-width:2}
.ch .hov{cursor:crosshair}
.ch .gbar{transform-box:fill-box;transform-origin:50% 100%;animation:barup .7s var(--ease) both;transition:opacity .2s,filter .2s}
.ch .gbar.dim2{opacity:.45}
@keyframes barup{from{transform:scaleY(0)}}
.ch .hit{cursor:pointer}
.ch .hit:hover{fill:color-mix(in srgb,var(--accent) 8%,transparent)}
.donw{display:grid;place-items:center;padding:4px 0}
.donut{width:min(190px,100%)}
.donut .dtrack{fill:none;stroke:var(--surface-2);stroke-width:24}
.donut .dseg{fill:none;stroke-width:24;cursor:pointer;animation:seg 1s var(--ease) both;transition:stroke-width .25s var(--ease),opacity .2s}
.donut .dseg:hover{stroke-width:30}
@keyframes seg{from{stroke-dasharray:0 var(--c)}}
.donut .dnum{font:800 34px var(--font);fill:var(--fg);letter-spacing:-.02em}
.donut .dlab{font:600 11.5px var(--font);fill:var(--fg-3)}
.dlist{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}
.dlist li{display:grid;grid-template-columns:minmax(0,1fr) auto 34px;gap:10px;align-items:center;padding:6px 8px;border-radius:8px;font-size:13px;cursor:pointer;transition:background .2s}
.dlist li:hover,.dlist li:focus-visible{background:var(--accent-soft);outline:none}
.dlist li span{display:flex;align-items:center;gap:7px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12.5px}
.dlist li i{width:10px;height:10px;border-radius:3px}
.dlist li b{font-variant-numeric:tabular-nums}
.dlist li em{font-style:normal;text-align:right;font-size:12px;color:var(--fg-3);font-variant-numeric:tabular-nums}
.dnote{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--fg-2);border-top:1px solid var(--line);padding-top:10px}
.ring{width:96px;height:96px;flex:none}
.ring .rtrack{fill:none;stroke:var(--surface-2);stroke-width:12}
.ring .rval{fill:none;stroke-width:12;stroke-linecap:round;animation:seg 1.3s var(--ease) both}
.ring .rpct{font:800 20px var(--font);fill:var(--fg)}
.trings{display:flex;flex-direction:column;gap:16px;justify-content:center;flex:1}
.trg{display:flex;align-items:center;gap:16px}
.trg>div{display:flex;flex-direction:column;gap:3px}
.trg>div>b{font-size:16px}
.trg .tag{align-self:flex-start}
.trg small{font-size:12.5px;color:var(--fg-2)}
.trg small b{font-variant-numeric:tabular-nums}
.trg .mvs{font-family:var(--mono);font-size:11.5px;color:var(--fg-3)}
.hbars{display:flex;flex-direction:column;gap:6px}
.hb{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 48px;align-items:center;gap:12px;padding:4px 6px;border:0;border-radius:8px;background:transparent;font:inherit;color:inherit;text-align:left;cursor:pointer;transition:background .2s}
.hb:hover{background:var(--accent-soft)}
div.hb{cursor:default}
.hbn{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbt{display:block;height:18px}
.hbw i{font:700 10.5px/18px var(--mono);color:#fff;text-align:center;overflow:hidden;white-space:nowrap}
.hbw{display:flex;gap:2px;height:100%;transform-origin:left;animation:hgrow .9s var(--ease) both}
.hbw i{display:block;height:100%;min-width:0}
.hbw i:first-child{border-radius:4px 0 0 4px}.hbw i:last-child{border-radius:0 4px 4px 0}.hbw i:only-child{border-radius:4px}
@keyframes hgrow{from{transform:scaleX(0)}}
.hbv{text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.hbv small{display:block;font-size:10.5px;font-weight:600;color:var(--fg-3)}
.esc .hb{grid-template-columns:72px minmax(0,1fr) 48px}
.occ{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.oc{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:12px;background:var(--surface-2);transition:transform .3s var(--ease),box-shadow .3s}
.oc:hover{transform:translateY(-3px);box-shadow:var(--sh-1)}
.och{display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:2px 8px}
.ocl{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800}
.ocl i{width:10px;height:10px;border-radius:3px}
.och b{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;grid-row:1/3;grid-column:2;align-self:center}
.och small{font-size:11.5px;color:var(--fg-3)}
.ch.mini .ax{font-size:10.5px}
.heat{display:flex;gap:8px}
.hwd{display:grid;grid-template-rows:repeat(7,1fr);gap:4px;font-size:10.5px;font-weight:700;color:var(--fg-3)}
.hwd span{display:flex;align-items:center;height:100%}
.hgrid{flex:1;display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.hc{position:relative;min-height:30px;border:0;border-radius:6px;cursor:pointer;font:600 10px var(--mono);color:var(--fg-3);display:flex;align-items:flex-start;justify-content:flex-end;padding:3px 5px;animation:hpop .45s var(--ease) both;transition:transform .2s var(--ease),box-shadow .2s}
.hc:hover:not(:disabled){transform:scale(1.12);box-shadow:0 4px 12px rgba(0,0,0,.18);z-index:1}
.hc:disabled{cursor:default;opacity:.35}
@keyframes hpop{from{transform:scale(.4);opacity:0}}
.hl0,.hleg .hl0{background:var(--surface-2)}
.hl1{background:color-mix(in srgb,var(--brand-g) 18%,var(--surface-2))}
.hl2{background:color-mix(in srgb,var(--brand-g) 36%,var(--surface-2))}
.hl3{background:color-mix(in srgb,var(--brand-g) 56%,var(--surface-2))}
.hl4{background:color-mix(in srgb,var(--brand-g) 78%,var(--surface-2));color:#fff}
.hl5{background:var(--btn-1);color:#fff}
.hc.tdy{box-shadow:0 0 0 2px var(--brand-o)}
.hleg i{display:inline-block;width:14px;height:14px;border-radius:3px}
.hleg span{font-size:11px;color:var(--fg-3)}
.plist,.alist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.plist li{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 4px;border-bottom:1px solid var(--line);cursor:pointer;border-radius:6px;transition:background .2s}
.plist li:hover{background:var(--accent-soft)}
.plist li:last-child{border-bottom:0}
.plist .av{width:32px;height:32px;font-size:11.5px}
.plist .pn{display:flex;flex-direction:column;min-width:0}
.plist .pn b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plist .pn small{font-size:11px;color:var(--fg-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plist li.none,.plist li.more{display:block;cursor:default;color:var(--fg-3);font-size:13px;padding:10px 4px}
.plist li.more a{color:var(--accent);font-weight:700;text-decoration:none}
.alist li{display:grid;grid-template-columns:30px 1fr 16px;gap:10px;align-items:center;padding:9px 6px;border-radius:8px;cursor:pointer;font-size:13px;transition:background .2s,transform .2s var(--ease)}
.alist li:hover{background:var(--surface-2);transform:translateX(3px)}
.alist li i{width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
.alist li i svg{width:16px;height:16px}
.alist li>svg{width:14px;height:14px;color:var(--fg-3)}
.alist li.w i{background:var(--warn-soft);color:var(--warn)}
.alist li.ok i{background:var(--pos-soft);color:var(--pos)}
.alist li.inf i{background:var(--neg-soft);color:var(--neg)}
.alist li b{font-variant-numeric:tabular-nums}
.dtip{position:fixed;z-index:80;pointer-events:none;max-width:260px;padding:9px 12px;border-radius:10px;background:var(--shell);color:var(--shell-fg);font-size:12.5px;line-height:1.5;box-shadow:var(--sh-2);opacity:0;transform:translateY(4px);transition:opacity .15s,transform .15s}
.dtip.on{opacity:1;transform:none}
.dtip b{color:#fff}
.dtip em{font-style:normal;font-size:10.5px;font-weight:800;color:var(--brand-o);text-transform:uppercase;letter-spacing:.05em}
.dtip .tsw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
@media (max-width:1180px){.s4,.s5,.s7,.s8{grid-column:span 6}.s8{grid-column:span 12}.occ{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){.dk-row{grid-template-columns:repeat(2,minmax(0,1fr))}.dhero{grid-template-columns:minmax(0,1fr)}.dupd{margin-left:0}}
@media (max-width:700px){.s4,.s5,.s6,.s7,.s8{grid-column:span 12}.dk-row,.occ{grid-template-columns:minmax(0,1fr)}.bigtxt b{font-size:42px}.dfil .sel select{min-width:0;width:100%}.dfil .fg{width:100%}.hb{grid-template-columns:minmax(0,100px) minmax(0,1fr) 40px}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style>

const maskCBO=v=>{const d=digits(v).slice(0,6);return d.length>4?d.slice(0,4)+'-'+d.slice(4):d};
function cpfOk(v){const d=digits(v);if(d.length!==11||/^(\d)\1{10}$/.test(d))return false;for(let t=9;t<11;t++){let s=0;for(let i=0;i<t;i++)s+=+d[i]*(t+1-i);if(((s*10)%11)%10!==+d[t])return false}return true}

function ciclo(c){const e=c.embarque||'';const des=e&&c.trab!=null?addD(e,c.trab):'';const re=des&&c.folga!=null?addD(des,c.folga):'';return {emb:e,des,reemb:re}}
function estado(c,ref=S.ref){
  const s=c.situacao||'ativo';if(s!=='ativo')return s;
  const fr=feriasDe(c.id);if(fr&&fr.some(([a,b])=>ref>=a&&ref<=b))return 'ferias';
  const y=ciclo(c);if(!y.emb||!y.des)return 'sem';
  if(ref<y.emb)return 'prog';if(ref<y.des)return 'emb';if(!y.reemb||ref<=y.reemb)return 'des';return 'venc';
}

const LKEY='efetivo-pa-v2';
function loadData(){
  let ok=false;
  try{const raw=localStorage.getItem(LKEY);if(raw){const o=JSON.parse(raw);COLS.forEach(c=>{if(Array.isArray(o[c]))S.data[c]=o[c]});if(Array.isArray(o.rotas))S.data.rotas=o.rotas;if(Array.isArray(o.postergacoes))S.data.postergacoes=o.postergacoes;if(Array.isArray(o.ausencias))S.data.ausencias=o.ausencias;if(Array.isArray(o.ausMeta))S.data.ausMeta=o.ausMeta;if(Array.isArray(o.ferias))S.data.ferias=o.ferias;if(Array.isArray(o.feriasMeta))S.data.feriasMeta=o.feriasMeta;if(Array.isArray(o.noshow))S.data.noshow=o.noshow;if(Array.isArray(o.movs))S.data.movs=o.movs;if(o.upd&&typeof o.upd==='object')S.data.upd=o.upd;if(Array.isArray(o.peMotivos))S.data.peMotivos=o.peMotivos;S.data.__mv=Array.isArray(o.movs);S.data.__ns=Array.isArray(o.noshow);S.data.__fe=Array.isArray(o.ferias);ok=true}}catch(e){}
  if(!ok){try{const o=JSON.parse($('#seed').textContent);COLS.forEach(c=>S.data[c]=o[c]||[]);saveLocal()}catch(e){}}
  if(!Array.isArray(S.data.rotas))S.data.rotas=[];
  if(!Array.isArray(S.data.ausencias)){try{const o=JSON.parse($('#af-seed').textContent);S.data.ausencias=o.regs;S.data.ausMeta=o.meta}catch(e){S.data.ausencias=[]}saveLocal()}
  if(!Array.isArray(S.data.ausMeta))S.data.ausMeta=[];
  if(!S.data.__fe){try{const o=JSON.parse($('#fe-seed').textContent);S.data.ferias=o.regs;S.data.feriasMeta=o.meta}catch(e){S.data.ferias=[];S.data.feriasMeta=[]}saveLocal()}
  delete S.data.__fe;
  if(!S.data.__ns){try{S.data.noshow=JSON.parse($('#ns-seed').textContent)}catch(e){S.data.noshow=[]}saveLocal()}
  delete S.data.__ns;
  if(!S.data.__mv){try{S.data.movs=JSON.parse($('#mv-seed').textContent)}catch(e){S.data.movs=[]}saveLocal()}
  delete S.data.__mv;
  if(!Array.isArray(S.data.postergacoes)){try{S.data.postergacoes=JSON.parse($('#pe-seed').textContent)}catch(e){S.data.postergacoes=[]}saveLocal()}
  applyAddrPatch();applyMatPatch();applyFerPatch();
  S.data.trechos=S.data.trechos.map(t=>t.icao?t:({...t,icao:({MAO:'SBEG',CAF:'SWCA'})[fold(t.codigo)]||''}));
  S.data.trechos=S.data.trechos.map(t=>t.rota!==undefined?t:({...t,rota:fold(t.codigo)!=='CAF'&&clean(t.icao)!=='SWCA'}));
}

/* one-time fill of matrícula PA / admissão from the ATIVOS workbook (only empty fields) */
function applyMatPatch(){
  const K='efetivo-pa-patch-mat-1';
  try{if(localStorage.getItem(K))return}catch(e){}
  let p={};try{p=JSON.parse($('#patch-mat').textContent)}catch(e){return}
  S.data.colaboradores=S.data.colaboradores.map(c=>{const x=p[c.id];if(!x)return c;const o={...c};if(!clean(o.matricula)&&x.m)o.matricula=x.m;if(!clean(o.admissao)&&x.a)o.admissao=x.a;return o});
  saveLocal();try{localStorage.setItem(K,'1')}catch(e){}
}
/* one-time fill of férias (GPER400) data base / saldo */
function applyFerPatch(){
  const K='efetivo-pa-patch-fer-1';
  try{if(localStorage.getItem(K))return}catch(e){}
  let p={};try{p=JSON.parse($('#patch-fer').textContent)}catch(e){return}
  S.data.colaboradores=S.data.colaboradores.map(c=>{const x=(p.c||{})[c.id];if(!x||c.ferBase)return c;return {...c,ferBase:x.b,ferVen:x.v,ferAbat:x.x,ferRef:p.ref}});
  saveLocal();try{localStorage.setItem(K,'1')}catch(e){}
}
function applyAddrPatch(){
  const K='efetivo-pa-patch-addr-1';
  try{if(localStorage.getItem(K))return}catch(e){}
  let p={};try{p=JSON.parse($('#patch-addr').textContent)}catch(e){return}
  let n=0;S.data.colaboradores=S.data.colaboradores.map(c=>{const x=p[c.id];if(!x)return c;const o={...c};['endereco','endereco2','telefone'].forEach(k=>{if(!clean(o[k])&&x[k]){o[k]=x[k];n++}});return o});
  saveLocal();try{localStorage.setItem(K,'1')}catch(e){}
}
function saveLocal(){S.ver++;try{localStorage.setItem(LKEY,JSON.stringify(S.data))}catch(e){toast('O navegador não deixou salvar os dados. Libere o armazenamento do site e tente de novo.','neg')}if(typeof cloudDirty==='function')cloudDirty()}
async function writeMany(c,recs){S.ver++;const a=S.data[c];const idx=new Map(a.map((r,i)=>[r.id,i]));recs.forEach(r=>{const i=idx.get(r.id);if(i!=null)a[i]=r;else{a.push(r);idx.set(r.id,a.length-1)}});saveLocal();schedule()}
const writeRec=(c,r)=>writeMany(c,[r]);
async function delRec(c,id){S.ver++;S.data[c]=S.data[c].filter(r=>r.id!==id);saveLocal();schedule()}

function render(){
  const ae=document.activeElement;
  if(ae&&ae.classList&&ae.classList.contains('cell-in')){S.pending=true;updateChrome();return}
  const main=$('#main');
  const fid=ae&&ae.id&&main.contains(ae)?ae.id:null;const caret=fid&&typeof ae.selectionStart==='number'?ae.selectionStart:null;
  const sc=main.scrollTop;const ts=$('.tscroll',main);const tsc=ts?[ts.scrollTop,ts.scrollLeft]:null;
  updateChrome();
  const r=S.route;
  const keep=main.dataset.r===r;
  main.innerHTML=r==='inicio'?homeHTML():r==='embarque'?embHTML():r==='rota'?rotaHTML():r==='postergacao'?peHTML():r==='ausencias'?afHTML():r==='ferias'?feHTML():r==='noshow'?nsHTML():r==='saidas'?mvHTML():r==='usuarios'?usersPageHTML():listHTML(r);
  main.dataset.r=r;
  if(keep){main.scrollTop=sc;const pg=$('.page',main);if(pg)pg.style.animation='none';const t2=$('.tscroll',main);if(t2&&tsc){t2.scrollTop=tsc[0];t2.scrollLeft=tsc[1]}}
  else $$('tbody tr',main).slice(0,24).forEach((tr,i)=>{tr.classList.add('anim');tr.style.animationDelay=i*20+'ms'});
  if(r==='inicio')wireHome();else if(r==='embarque')wireEmb();else if(r==='rota')wireRota();else if(r==='postergacao')wirePE();else if(r==='ausencias')wireAF();else if(r==='ferias')wireFE();else if(r==='noshow')wireNS();else if(r==='saidas')wireMV();else if(r==='usuarios')wireUsers();else wireList(r);
  if(fid){const el=document.getElementById(fid);if(el){el.focus({preventScroll:true});if(caret!=null&&el.setSelectionRange)try{el.setSelectionRange(caret,caret)}catch(e){}}}
}
function updateChrome(){
  $$('.nav a').forEach(a=>a.classList.toggle('on',a.dataset.r===S.route));
  COLS.forEach(c=>{const el=$(`.cnt[data-c="${c}"]`);if(el)el.textContent=S.data[c].length});
  {const el=$('.cnt[data-c="movs"]');const n=(S.data.movs||[]).filter(m=>!m.reativadoEm).length;if(el){el.textContent=n||'';el.hidden=!n}}
  const v=ativos().filter(c=>estado(c,todayISO())==='venc').length;const el=$('.cnt[data-c="venc"]');
  el.textContent=v||'';el.hidden=!v;el.classList.toggle('hot',!!v);
}
document.addEventListener('focusout',e=>{if(e.target.classList&&e.target.classList.contains('cell-in')){setTimeout(()=>{const a=document.activeElement;if(S.pending&&!(a&&a.classList&&a.classList.contains('cell-in'))){S.pending=false;schedule()}},0)}});

function movDays(n,from){
  const cs=ativos().filter(c=>(c.situacao||'ativo')==='ativo');const cy=cs.map(c=>[c,ciclo(c)]);
  const out=[];for(let i=0;i<n;i++){const d=addD(from,i);const up=[],dn=[];cy.forEach(([c,y])=>{if(y.emb===d||y.reemb===d)up.push(c);if(y.des===d)dn.push(c)});out.push({d,up,dn})}
  return out;
}
function byTrecho(list){const m={};list.forEach(c=>{const t=refRec('trechos',c.trechoId);const k=t?t.codigo:'—';m[k]=(m[k]||0)+1});return Object.entries(m).sort((a,b)=>b[1]-a[1])}
/* ---------- generic list ---------- */
function rows(ent){
  const E=ENT[ent],q=S.q[ent];const t=todayISO();
  let a=S.data[ent].slice();
  const s=clean(q.s).toLowerCase();
  if(s){const sd=digits(s);a=a.filter(r=>E.search.some(k=>{const v=String(r[k]||'').toLowerCase();return v.includes(s)||(sd.length>=3&&digits(v).includes(sd))}))}
  E.filters.forEach(f=>{const v=q.f[f.k];if(!v)return;
    if(f.bool)a=a.filter(r=>(r[f.k]!==false)===(v==='1'));
    else if(f.k==='_st')a=a.filter(r=>estado(r,t)===v);
    else if(v==='_none')a=a.filter(r=>!r[f.k]);
    else a=a.filter(r=>(r[f.k]||'')===v)});
  const so=S.sort[ent]||{k:E.defSort,dir:1};
  const col=E.cols.find(c=>c.k===so.k)||E.cols[0];
  const key=r=>{if(col.sv)return col.sv(r);if(col.k==='_ef')return efCount(ent,r.id);if(col.k==='_embq')return embCount(ent,r.id);if(col.ref){const x=refRec(col.ref,r[col.k]);return x?x.nome.toLowerCase():'￿'}const v=r[col.k];return typeof v==='number'?v:String(v??'').toLowerCase()};
  a.sort((x,y)=>{const A=key(x),B=key(y);return (A<B?-1:A>B?1:0)*so.dir||String(x.id).localeCompare(String(y.id))});
  return a;
}
function embCount(ent,id){const k=REFKEY[ent];const t=todayISO();return ativos().filter(c=>c[k]===id&&estado(c,t)==='emb').length}
function cellHTML(ent,c,r){
  if(c.td)return c.td(r);
  if(c.k==='_ef')return `<b class="num">${efCount(ent,r.id)}</b>`;
  if(c.k==='_embq')return `<span class="num">${embCount(ent,r.id)}</span>`;
  if(c.ref){const x=refRec(c.ref,r[c.k]);if(!x)return `<span class="dim">${r[c.k]?'Removido':(c.empty||'—')}</span>`;return c.plain?esc(x.nome):`<div class="ref"><span>${esc(x.nome)}</span><small>${esc(x.codigo)}</small></div>`}
  const v=r[c.k];if(v===undefined||v===null||v==='')return '<span class="dim">—</span>';
  if(c.mono)return `<span class="mono">${esc(v)}</span>`;
  if(c.strong)return `<b>${esc(v)}</b>`;
  return esc(v);
}

function refreshTable(ent){
  const q=S.q[ent];$('#tbody').innerHTML=tableHTML(ent);

function wireTable(ent){
  const t=$('#tbody');
  $$('[data-sort]',t).forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.sort;const cur=S.sort[ent]||{k:ENT[ent].defSort,dir:1};S.sort[ent]={k,dir:cur.k===k?-cur.dir:1};refreshTable(ent)}));
  $$('tbody tr',t).forEach(tr=>{tr.addEventListener('click',()=>openPanel(ent,tr.dataset.id));tr.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();openPanel(ent,tr.dataset.id)}})});

  $$('[data-clear]',t).forEach(b=>b.addEventListener('click',()=>{S.q[ent]={s:'',f:{}};render()}));
}

function embRows(skipCF){
  const q=S.emb;let a=OUTS.includes(q.status)?S.data.colaboradores.slice():ativos();
  const s=clean(q.s).toLowerCase();
  if(s){const sd=digits(s);a=a.filter(c=>String(c.nome||'').toLowerCase().includes(s)||(sd.length>=3&&(digits(c.sispat).includes(sd)||digits(c.matricula).includes(sd)))||String(c.obs||'').toLowerCase().includes(s))}
  EMB_F.forEach(f=>{const v=q.f[f.k];if(v)a=a.filter(c=>(f.k==='grupo'?(c.grupo||'Sem grupo'):(c[f.k]||''))===v)});
  if(q.status)a=a.filter(c=>estado(c)===q.status);
  if(q.day){a=a.filter(c=>{const y=ciclo(c);return y.emb===q.day||y.des===q.day||y.reemb===q.day})}

function mvBadge(c){const d=S.emb.day;if(!d)return '';const y=ciclo(c);if(y.emb===d||y.reemb===d)return `<span class="mv up" title="Embarca em ${fmtDate(d)}">${ic('up')}</span>`;if(y.des===d)return `<span class="mv dn" title="Desembarca em ${fmtDate(d)}">${ic('down')}</span>`;return ''}
/* back cell: merged box for a pair, single tag otherwise */

function embTableHTML(){
  const a=embRows();
  if(!S.data.colaboradores.length)return `<div class="empty"><span class="ic">${ic('swap')}</span><h3>Nenhum colaborador cadastrado</h3><p>Cadastre colaboradores ou importe a planilha de embarque para montar o controle.</p><button class="btn emph" type="button" data-imp>${ic('upload')}Importar planilha</button></div>`;
  if(!a.length)return `<div class="empty"><span class="ic">${ic('search')}</span><h3>Nenhum colaborador encontrado</h3><p>Ninguém corresponde à busca, aos filtros, ao status ou ao dia escolhido.</p><button class="btn" type="button" data-eclear>${ic('reset')}Limpar filtros</button></div>`;
  const so=S.emb.sort;const col=EMB_COLS.find(c=>c.k===so.k);
  const key=col?col.sv:(c=>c.ordem??1e9);
  const g=new Map();grupos().forEach(n=>g.set(n,[]));
  a.forEach(c=>{const n=c.grupo||'Sem grupo';if(!g.has(n))g.set(n,[]);g.get(n).push(c)});
  const ref=S.ref;let body='',pairNo=0;
  g.forEach((list,name)=>{if(!list.length)return;
    list.sort((x,y)=>{const A=key(x),B=key(y);return ((A<B?-1:A>B?1:0)*so.dir)||((x.ordem??1e9)-(y.ordem??1e9))});
    // keep each back pair together: the partner follows the first one found
    const inList=new Map(list.map(c=>[c.id,c]));const placed=new Set();const units=[];
    list.forEach(c=>{if(placed.has(c.id))return;placed.add(c.id);const p=c.backId&&inList.get(c.backId);
      if(p&&!placed.has(p.id)&&p.backId===c.id){placed.add(p.id);units.push([c,p])}else units.push([c])});
    const conta=list.filter(c=>c.conta!==false).length;const e=list.filter(c=>estado(c,ref)==='emb').length;const d=list.filter(c=>estado(c,ref)==='des').length;
    body+=`<tr class="g"><td colspan="${EMB_COLS.length}"><div class="gh"><b>${esc(name)}</b><span class="n">${conta}</span><span>no efetivo · ${e} embarcado${e!==1?'s':''} · ${d} desembarcado${d!==1?'s':''}</span></div></td></tr>`;
    units.forEach((u,i)=>{const zebra=i%2===1;
      if(u.length===2){pairNo++;body+=embRowHTML(u[0],{mode:'pair',pairNo,partner:u[1],zebra,pairTop:1})+embRowHTML(u[1],{mode:'skip',zebra,end:1})}
      else body+=embRowHTML(u[0],{mode:'single',zebra,end:1});
    });
  });
  return `<div class="tscroll"><table class="emb"><thead><tr>${EMB_COLS.map(c=>c.nosort?`<th class="${c.cls}"></th>`:`<th class="${c.cls} ${c.r?'r':''} ${so.k===c.k?'sorted':''} ${so.k===c.k&&so.dir<0?'desc':''}"><div class="thw"><button type="button" class="ths" data-esort="${c.k}" title="Ordenar por ${esc(c.l.toLowerCase())}">${c.l}${so.k===c.k?ic(so.dir>0?'up':'down'):''}</button><button type="button" class="thf ${(S.emb.cf||{})[c.k]?'on':''}" data-cf="${c.k}" title="Filtrar ${esc(c.l.toLowerCase())}" aria-label="Filtrar ${esc(c.l)}" aria-haspopup="dialog">${ic((S.emb.cf||{})[c.k]?'funnel':'caret')}</button></div></th>`).join('')}</tr></thead><tbody>${body}</tbody></table></div>`;
}

const HL={embarque:'Embarque',trab:'Dias de trabalho',folga:'Dias de folga'};
function histAdd(c,k,o,n,pref){const f=v=>k==='embarque'?fmtDate(v):(v==null||v===''?'—':v);return [{d:new Date().toISOString(),t:`${pref||''}${HL[k]}: ${f(o)} → ${f(n)}`},...(c.hist||[])].slice(0,60)}
function inlineSave(el){
  const tr=el.closest('tr');const c=S.data.colaboradores.find(x=>x.id===tr.dataset.id);if(!c)return;
  const k=el.dataset.k;let v=el.value;
  if(k==='embarque'){if(v&&!pd(v))return;v=v||''}
  else{v=v===''?null:Number(v);if(v!=null&&(!Number.isInteger(v)||v<0||v>365)){toast('Informe um número inteiro de dias entre 0 e 365.','neg');el.value=c[k]??'';return}}
  if((c[k]??(k==='embarque'?'':null))===v)return;
  const rec={...c,[k]:v,atualizadoEm:new Date().toISOString(),hist:histLog(c,{...c,[k]:v},'Controle de embarque')};
  writeRec('colaboradores',rec);
  const y=ciclo(rec);
  $('[data-c="des"]',tr).textContent=fmtDate(y.des);$('[data-c="re"]',tr).textContent=fmtDate(y.reemb);$('[data-c="st"]',tr).innerHTML=estPill(estado(rec))+mvBadge(rec);
  el.classList.remove('saved');void el.offsetWidth;el.classList.add('saved');
  toast(`Escala de ${shortName(c.nome)} salva`);
}
function advanceTo(c,ref){let e=c.embarque;const step=(c.trab||0)+(c.folga||0);if(!e||!step)return e;let guard=0;while(addD(e,step)<ref&&guard++<500)e=addD(e,step);return e}
function askAdvance(){
