const nf=n=>Number(n||0).toLocaleString('pt-BR');
function niceMax(v){if(v<=4)return 4;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;const m=n<=1?1:n<=2?2:n<=2.5?2.5:n<=4?4:n<=5?5:10;return m*p}
function dashColabs(){const D=S.dash;return ativos().filter(c=>(!D.tr||c.trechoId===D.tr)&&(!D.grupo||(c.grupo||'Sem grupo')===D.grupo))}
const dashHas=cid=>{const D=S.dash;if(!D.tr&&!D.grupo)return true;const c=cid&&refRec('colaboradores',cid);return !!c&&(!D.tr||c.trechoId===D.tr)&&(!D.grupo||(c.grupo||'Sem grupo')===D.grupo)};
/* status on any date: official status for today, schedule projection for other days */
function stateAt(c,d,t){
  if(d===t)return estado(c,d);
  const s=c.situacao||'ativo';if(s!=='ativo')return s;
  const fr=feriasDe(c.id);if(fr&&fr.some(([a,b])=>d>=a&&d<=b))return 'ferias';
  if(!c.embarque||!c.trab)return 'sem';if(!c.folga)return estado(c,d);
  const st=c.trab+c.folga;const off=((Math.round((pd(d)-pd(c.embarque))/864e5)%st)+st)%st;return off<c.trab?'emb':'des';
}
function movesBy(list,from,n){const h=addD(from,n);const m=new Map();for(let i=0;i<n;i++)m.set(addD(from,i),{up:[],dn:[]});
  list.forEach(c=>eventsFor(c,h).forEach(ev=>{const x=m.get(ev.d);if(x)x[ev.dir==='emb'?'up':'dn'].push(c)}));return m}
const perShift=(per,k)=>{const y=+per.slice(0,4),m=+per.slice(5,7)-1+k;return iso(Date.UTC(y,m,1)).slice(0,7)};
const tipAttr=h=>`data-tip="${esc(h)}"`;
const pctTxt=(a,b)=>b?Math.round(a/b*100)+'%':'0%';

/* ---------- chart builders (SVG, viewBox scaled) ---------- */
function lineChart(id,days,series,t){
  const W=760,H=260,ml=38,mr=16,mt=16,mb=30,iw=W-ml-mr,ih=H-mt-mb,n=days.length;
  const max=niceMax(Math.max(1,...series.flatMap(s=>s.vals)));
  const x=i=>ml+(n<2?0:i*iw/(n-1)),y=v=>mt+ih-v/max*ih;
  let g='';for(let k=0;k<=4;k++){const v=max*k/4,yy=y(v);g+=`<line class="gl" x1="${ml}" x2="${W-mr}" y1="${yy}" y2="${yy}"/><text class="ax" x="${ml-8}" y="${yy+4}" text-anchor="end">${nf(v)}</text>`}
  const step=Math.max(1,Math.ceil(n/9));let xl='';days.forEach((d,i)=>{if(i%step===0||i===n-1)xl+=`<text class="ax" x="${x(i)}" y="${H-8}" text-anchor="middle">${fmtDM(d)}</text>`});
  const ti=days.indexOf(t);
  const today=ti>=0?`<line class="tdl" x1="${x(ti)}" x2="${x(ti)}" y1="${mt}" y2="${mt+ih}"/><text class="tdt" x="${x(ti)+5}" y="${mt+10}">HOJE</text>`:'';
  const paths=series.map((s,si)=>{const d=s.vals.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
    const area=s.area?`<path class="ar" d="${d}L${x(n-1)},${y(0)}L${x(0)},${y(0)}Z" fill="url(#gr-${id}-${si})"/>`:'';
    return `<defs><linearGradient id="gr-${id}-${si}" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${s.color}" stop-opacity=".32"/><stop offset="1" stop-color="${s.color}" stop-opacity="0"/></linearGradient></defs>${area}<path class="ln ${s.dash?'dsh':''}" d="${d}" ${s.dash?'':'pathLength="1"'} stroke="${s.color}" style="animation-delay:${si*180}ms"/>`}).join('');
  const ends=series.map(s=>{const v=s.vals[n-1];return `<circle class="ldot" cx="${x(n-1)}" cy="${y(v)}" r="4" fill="${s.color}"/>`}).join('');
  const tdots=ti>=0?series.map(s=>`<circle class="tdot" cx="${x(ti)}" cy="${y(s.vals[ti])}" r="5" fill="${s.color}"/>`).join(''):'';
  const lstep=Math.max(1,Math.ceil(n/16));const idx=new Set();for(let i=0;i<n;i+=lstep)idx.add(i);idx.add(n-1);if(ti>=0)idx.add(ti);
  [...idx].forEach(i=>{if(i!==n-1&&i!==ti&&(idx.has(i+1)||idx.has(i-1))&&(i+1===ti||i-1===ti||i+1===n-1))idx.delete(i)});
  let dls='';[...idx].sort((a,b)=>a-b).forEach((i,k)=>{const vs=series.map(s=>s.vals[i]);const order=vs.map((v,j)=>[v,j]).sort((a,b)=>b[0]-a[0]);
    series.forEach((s,j)=>{const v=s.vals[i];const yy=y(v);const rank=order.findIndex(o=>o[1]===j);const close=series.some((s2,j2)=>j2!==j&&Math.abs(y(s2.vals[i])-yy)<16);
      const below=close&&rank>0&&yy<mt+ih-14;const ly=below?yy+15:yy-8;const anchor=i===0?'start':i===n-1?'end':'middle';
      dls+=`<text class="dl ${i===ti?'dlt':''}" x="${x(i)}" y="${Math.max(mt+9,Math.min(mt+ih-3,ly))}" text-anchor="${anchor}" style="animation-delay:${900+k*25}ms">${nf(v)}</text>`})});
  DCH[id]={days,series,x,y,ml,iw,W,H,mt,ih,n};
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de linhas">${g}${xl}${today}${paths}${ends}${tdots}<g class="dls">${dls}</g>
    <g class="xh" hidden><line class="xhl" y1="${mt}" y2="${mt+ih}"/>${series.map(s=>`<circle r="5" fill="${s.color}" class="xhd"/>`).join('')}</g>
    <rect class="hov" data-chart="${id}" x="${ml}" y="${mt}" width="${iw}" height="${ih}" fill="transparent"/></svg>`;
}
function donutChart(segs,total,label){
  const R=74,C=2*Math.PI*R;let off=0;
  const arcs=segs.filter(s=>s.v>0).map((s,i)=>{const len=s.v/Math.max(1,total)*C;const a=`<circle class="dseg" cx="100" cy="100" r="${R}" stroke="${s.color}" style="stroke-dasharray:${Math.max(.1,len-3).toFixed(2)} ${C.toFixed(2)};stroke-dashoffset:${(-off).toFixed(2)};--c:${C.toFixed(2)};animation-delay:${i*110}ms" ${tipAttr(`<b>${s.l}</b><br>${nf(s.v)} · ${pctTxt(s.v,total)}`)} ${s.go?`data-go="${s.go}"`:''}/>`;off+=len;return a}).join('');
  let acc=0;const dlab=segs.filter(s=>s.v>0).map((s,i)=>{const p=s.v/Math.max(1,total);const mid=(acc+p/2)*2*Math.PI-Math.PI/2;acc+=p;if(p<.06)return '';return `<text class="dpl" x="${(100+R*Math.cos(mid)).toFixed(1)}" y="${(100+R*Math.sin(mid)+4).toFixed(1)}" text-anchor="middle" style="animation-delay:${700+i*110}ms">${Math.round(p*100)}%</text>`}).join('');
  return `<svg class="ch donut" viewBox="0 0 200 200" role="img" aria-label="${esc(label)}"><circle cx="100" cy="100" r="${R}" class="dtrack"/><g transform="rotate(-90 100 100)">${arcs}</g>${dlab}
    <text x="100" y="98" text-anchor="middle" class="dnum" data-count="${total}">0</text><text x="100" y="120" text-anchor="middle" class="dlab">${esc(label)}</text></svg>`;
}
function ringChart(v,tot,color,lab){
  const R=46,C=2*Math.PI*R,p=tot?v/tot:0;
  return `<svg class="ch ring" viewBox="0 0 120 120" role="img" aria-label="${esc(lab)}: ${pctTxt(v,tot)}"><circle cx="60" cy="60" r="${R}" class="rtrack"/><circle cx="60" cy="60" r="${R}" class="rval" stroke="${color}" transform="rotate(-90 60 60)" style="stroke-dasharray:${(p*C).toFixed(2)} ${C.toFixed(2)};--c:${C.toFixed(2)}"/>
    <text x="60" y="64" text-anchor="middle" class="rpct" data-count="${Math.round(p*100)}" data-suf="%">0%</text></svg>`;
}
function barPath(x,y,w,h,r){if(h<=0)return '';r=Math.min(r,w/2,h);return `M${x},${y+h}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+h}Z`}
function groupedBars(id,cats,series,opts={}){
  const W=opts.W||760,H=opts.H||240,ml=34,mr=10,mt=18,mb=34,iw=W-ml-mr,ih=H-mt-mb,n=cats.length,k=series.length;
  const max=niceMax(Math.max(1,...series.flatMap(s=>s.vals)));const y=v=>mt+ih-v/max*ih;
  const band=iw/n,gw=Math.min(band*.72,k*26),bw=(gw-(k-1)*2)/k;
  let g='';for(let j=0;j<=4;j++){const v=max*j/4;g+=`<line class="gl" x1="${ml}" x2="${W-mr}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${ml-6}" y="${y(v)+4}" text-anchor="end">${nf(v)}</text>`}
  let bars='',lab='';
  cats.forEach((c,i)=>{const x0=ml+i*band+(band-gw)/2;
    series.forEach((s,si)=>{const v=s.vals[i];const yy=y(v);bars+=`<path class="gbar" d="${barPath(x0+si*(bw+2),yy,bw,mt+ih-yy,3)}" fill="${s.color}" style="animation-delay:${i*35+si*60}ms"/>${v?`<text class="bvl" x="${(x0+si*(bw+2)+bw/2).toFixed(1)}" y="${(yy-4).toFixed(1)}" text-anchor="middle" style="animation-delay:${600+i*35+si*60}ms">${nf(v)}</text>`:''}`});
    bars+=`<rect class="hit" x="${ml+i*band}" y="${mt}" width="${band}" height="${ih}" fill="transparent" ${tipAttr(`<b>${c.tip||c.l}</b><br>${series.map(s=>`<i class="tsw" style="background:${s.color}"></i>${s.l}: <b>${nf(s.vals[i])}</b>`).join('<br>')}`)} ${c.go?`data-go="${c.go}"`:''}/>`;
    lab+=`<text class="ax ${c.hl?'axh':''}" x="${ml+i*band+band/2}" y="${H-16}" text-anchor="middle">${esc(c.l)}</text>${c.s?`<text class="ax2 ${c.hl?'axh':''}" x="${ml+i*band+band/2}" y="${H-4}" text-anchor="middle">${esc(c.s)}</text>`:''}`;
  });
  return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||'Gráfico de barras')}">${g}${bars}${lab}</svg>`;
}
function miniCols(vals,labels,color,curIdx,go,unit){
  const W=260,H=120,mt=18,mb=20,ml=4,mr=4,iw=W-ml-mr,ih=H-mt-mb,n=vals.length;const max=niceMax(Math.max(1,...vals));
  const band=iw/n,bw=Math.min(26,band*.62);
  return `<svg class="ch mini" viewBox="0 0 ${W} ${H}" role="img" aria-label="Últimos períodos"><line class="gl" x1="${ml}" x2="${W-mr}" y1="${mt+ih}" y2="${mt+ih}"/>${vals.map((v,i)=>{const x=ml+i*band+(band-bw)/2,h=v/max*ih,yy=mt+ih-h;
    return `<path class="gbar ${i===curIdx?'':'dim2'}" d="${barPath(x,yy,bw,h,3)}" fill="${color}" style="animation-delay:${i*60}ms"/><text class="vl ${i===curIdx?'vlc':''}" x="${x+bw/2}" y="${yy-5}" text-anchor="middle">${nf(v)}</text><text class="ax ${i===curIdx?'axh':''}" x="${x+bw/2}" y="${H-5}" text-anchor="middle">${esc(labels[i])}</text><rect x="${ml+i*band}" y="0" width="${band}" height="${H}" fill="transparent" class="hit" ${tipAttr(`<b>${esc(labels[i])}</b><br>${nf(v)} ${unit}`)} data-go="${go[i]}"/>`}).join('')}</svg>`;
}
function spark(vals,color){const W=120,H=34,n=vals.length,max=Math.max(1,...vals),min=Math.min(...vals),rg=Math.max(1,max-min);const x=i=>i*W/(n-1),y=v=>H-3-(v-min)/rg*(H-8);
  const d=vals.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  return `<svg class="spk" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true"><path d="${d}L${W},${H}L0,${H}Z" fill="${color}" opacity=".14"/><path class="ln" d="${d}" pathLength="1" stroke="${color}"/><circle cx="${x(n-1)}" cy="${y(vals[n-1])}" r="2.6" fill="${color}"/></svg>`}

function cellISO(v){
  if(typeof v==='number'&&v>36526&&v<80000)return iso(Date.UTC(1899,11,30)+Math.round(v)*864e5);
  if(v instanceof Date&&!isNaN(v)&&v.getFullYear()>2000)return `${v.getFullYear()}-${pad(v.getMonth()+1)}-${pad(v.getDate())}`;
  if(typeof v==='string'){const m=/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/.exec(v.trim());if(m){const y=m[3].length===2?2000+ +m[3]:+m[3];return `${y}-${pad(m[2])}-${pad(m[1])}`}}
  return '';
}

function parseSheet(aoa){

    out.push({row:i,sec,back:fold(r[I.back]),sispat:digits(r[I.sis])||clean(r[I.sis]),nome:d.toUpperCase(),setor:clean(r[I.setor]),funcao:clean(r[I.func]),trecho:clean(r[I.tr]).toUpperCase(),trab:toInt(r[I.trab]),folga:toInt(r[I.folga]),emb:cellISO(r[I.emb]),obs:I.obs<0?'':clean(r[I.obs]).replace(/[\s/]+$/,''),conta:r[0]!==0,matricula:I.mat>=0?digits(r[I.mat]):''});
  }

}

function planImport({out,vagas},fname){

    ${nSet.size||nFn.size||nTr.size?`<li>Novos cadastros: <b>${nSet.size}</b> setor${nSet.size!==1?'es':''}, <b>${nFn.size}</b> funç${nFn.size!==1?'ões':'ão'}, <b>${nTr.size}</b> trecho${nTr.size!==1?'s':''}</li>`:''}
    ${vagas.length?`<li><b>${vagas.length}</b> linha${vagas.length!==1?'s':''} sem SISPAT (vagas em aberto) ficam de fora</li>`:''}
    ${fora?`<li><b>${fora}</b> colaborador${fora!==1?'es':''} do sistema não está${fora!==1?'ão':''} na planilha e não ser${fora!==1?'ão':'á'} alterado${fora!==1?'s':''}</li>`:''}</ul></div></div>

  const d=S.data;const sMap=new Map(d.setores.map(x=>[fold(x.nome),x])),fMap=new Map(d.funcoes.map(x=>[fold(x.nome),x])),tMap=new Map(d.trechos.map(x=>[fold(x.codigo),x]));
  const sc=nextCode('ST',d.setores),fc=nextCode('FN',d.funcoes);let ns=0,nf=0;
  const getS=n=>{if(!n)return '';const k=fold(n);if(!sMap.has(k)){const r={id:uid(),codigo:sc(++ns),nome:clean(n).toUpperCase(),gestor:'',centroCusto:'',ativo:true,criadoEm:now};d.setores.push(r);sMap.set(k,r)}return sMap.get(k).id};
  const getF=n=>{if(!n)return '';const k=fold(n);if(!fMap.has(k)){const r={id:uid(),codigo:fc(++nf),nome:clean(n).toUpperCase(),cbo:'',tipo:'',setorId:'',ativo:true,criadoEm:now};d.funcoes.push(r);fMap.set(k,r)}return fMap.get(k).id};
  const getT=n=>{if(!n)return '';if(!tMap.has(n)){const r={id:uid(),codigo:n,nome:n,modal:'Aéreo',descricao:'',ativo:true,criadoEm:now};d.trechos.push(r);tMap.set(n,r)}return tMap.get(n).id};
  const bySis=new Map(d.colaboradores.map(c=>[digits(c.sispat)||c.sispat,c]));const ids=new Set(d.colaboradores.map(c=>c.id));
  const recs=out.map((p,i)=>{const ex=bySis.get(p.sispat);
    let id=ex?ex.id:'c'+p.sispat;if(!ex){while(ids.has(id))id='c'+p.sispat+'-'+uid().slice(-4);ids.add(id)}
    const base=ex?{...ex}:{id,cpf:'',telefone:'',situacao:'ativo',admissao:'',hist:[],criadoEm:now};
    let hist=base.hist||[];
    if(ex)hist=histLog({...ex,hist},{...ex,embarque:p.emb,trab:p.trab,folga:p.folga},'Importado da planilha');
    return {...base,sispat:p.sispat,nome:p.nome,grupo:p.sec,setorId:getS(p.setor),funcaoId:getF(p.funcao),trechoId:getT(p.trecho),papel:p.back==='FERISTA'?'ferista':p.back==='S. BACK'?'semback':'',conta:p.conta,trab:p.trab,folga:p.folga,embarque:p.emb,obs:p.obs,ordem:i+1,backId:'',hist,atualizadoEm:now}});
  for(let i=0;i<out.length-1;i++){const p=out[i],q=out[i+1];if(p.back==='BACK'&&q.row===p.row+1&&q.sec===p.sec&&q.back!=='BACK'&&!recs[i].backId&&!recs[i+1].backId){recs[i].backId=recs[i+1].id;recs[i+1].backId=recs[i].id}}
  const imp=new Set(recs.map(r=>r.id));const N=recs.length;
  const others=d.colaboradores.filter(c=>!imp.has(c.id)).map(c=>{const o={...c,ordem:N+(c.ordem??0)};if(o.backId&&imp.has(o.backId)){const pr=recs.find(r=>r.id===o.backId);if(pr&&pr.backId!==o.id)o.backId=''}return o});
  d.colaboradores=[...recs,...others];
  saveLocal();schedule();
  toast(`Planilha importada: ${N} colaboradores`);
}


/* phones: "(92) 99999-0000 / 98888-0000" */
function fmtPhones(s){
  s=clean(String(s??'').replace(/ /g,' '));if(!s)return '';
  const rx=/(?:\(?\s*0?(\d{2})\s*\)?[\s.-]*)?(9?)\s?(\d{4})[\s.-]*(\d{4})(?!\d)/g;
  const out=[],seen=new Set();let used=0,m;
  while((m=rx.exec(s))){used+=digits(m[0]).length;const num=`${m[2]}${m[3]}-${m[4]}`;const k=num.slice(-9);if(seen.has(k))continue;seen.add(k);out.push(m[1]?`(${m[1]}) ${num}`:num)}
  return out.length&&used===digits(s).length?out.join(' / '):s;
}

/* ---- matrícula PA / admissão (planilha ATIVOS do RH) ---- */
const NPART=new Set(['DE','DA','DO','DOS','DAS','E']);
const ntok=x=>fold(x).replace(/[^A-Z ]/g,' ').split(/\s+/).filter(w=>w&&!NPART.has(w));
function lev(a,b){let p=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){const c=[i];for(let j=1;j<=b.length;j++)c.push(Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]!==b[j-1]?1:0)));p=c}return p[b.length]}
function nameNear(a,b){const x=ntok(a),y=ntok(b);if(!x.length||x.length!==y.length||x[0]!==y[0])return false;let t=0;for(let i=0;i<x.length;i++){const d=lev(x[i],y[i]);if(d>1)return false;t+=d}return t<=2}
function funcScore(a,b){const B=ntok(b);return ntok(a).filter(u=>B.some(v=>v.startsWith(u.slice(0,4))||u.startsWith(v.slice(0,4)))).length}
const baseNome=n=>String(n||'').replace(/\s*-?\s*\d{5,}\s*$/,'');
function xlDate(v){if(v instanceof Date&&!isNaN(v))return iso(Date.UTC(v.getFullYear(),v.getMonth(),v.getDate()+(v.getHours()>=12?1:0)));
  if(typeof v==='number'&&v>20000&&v<80000)return iso(Date.UTC(1899,11,30)+Math.round(v)*864e5);
  const m=/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/.exec(String(v||'').trim());if(m){const y=m[3].length===2?2000+ +m[3]:+m[3];return iso(Date.UTC(y,+m[2]-1,+m[1]))}
  const k=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(v||''));return k?k[0]:''}
function matchAtivos(list){
  const used=new Set(),out=new Map(),byM=new Map(list.map(r=>[r.m,r]));
  const fnome=c=>(refRec('funcoes',c.funcaoId)||{}).nome||'';
  const cs=S.data.colaboradores;
  cs.forEach(c=>{const m=/(\d{5,})\s*$/.exec(c.nome||'');if(m){const r=byM.get(m[1].padStart(6,'0'))||byM.get(m[1]);if(r&&!used.has(r.m)){used.add(r.m);out.set(c.id,{r,k:'exato'})}}});
  cs.forEach(c=>{if(out.has(c.id))return;let cand=list.filter(r=>!used.has(r.m)&&fold(r.n)===fold(baseNome(c.nome)));
    if(cand.length>1){const f=fnome(c);cand=cand.map(r=>({r,s:funcScore(f,r.f)})).sort((a,b)=>b.s-a.s);cand=cand[0].s>cand[1].s?[cand[0].r]:[]}
    if(cand.length===1){used.add(cand[0].m);out.set(c.id,{r:cand[0],k:'exato'})}});
  cs.forEach(c=>{if(out.has(c.id))return;const cand=list.filter(r=>!used.has(r.m)&&nameNear(baseNome(c.nome),r.n));if(cand.length===1){used.add(cand[0].m);out.set(c.id,{r:cand[0],k:'semelhante'})}});
  return out;
}

/* ================= gestão de férias: saldo, limites e programação ================= */
function addM(s,n){const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(s||'');if(!m)return '';const y=+m[1],mo=+m[2]-1+n,d=+m[3];const last=new Date(Date.UTC(y,mo+1,0)).getUTCDate();return iso(Date.UTC(y,mo,Math.min(d,last)))}
const addY=(s,n)=>addM(s,12*n);
const dDiff=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
/* avos de férias (regra do 15º dia), no máximo 12 */
function avos(ini,ref){if(!ini||!ref||ref<ini)return 0;let n=0;while(n<12&&addD(addM(ini,n+1),-1)<=ref)n++;if(n<12&&dDiff(addM(ini,n),ref)+1>=15)n++;return Math.min(n,12)}
const WD=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const wd=s=>WD[new Date(pd(s)).getUTCDay()];
const fdias=v=>{const x=Math.round((+v||0)*10)/10;return x.toLocaleString('pt-BR',{maximumFractionDigits:1})};
/* início das férias em relação ao desembarque, por tipo */
const offFor=(tipo,folga)=>tipo==='1ª PARCELA'?0:/PARCELA/.test(tipo||'')?2:(folga??14);
const diasFor=tipo=>tipo==='1ª PARCELA'?14:/PARCELA/.test(tipo||'')?8:30;
let fbcIdx=null,fbcKey=-1;
function feByC(){if(fbcKey!==S.ver){fbcIdx=new Map();(S.data.ferias||[]).forEach(r=>{if(!r.colabId)return;const y=feCalc(r);if(!y.ini)return;if(!fbcIdx.has(r.colabId))fbcIdx.set(r.colabId,[]);fbcIdx.get(r.colabId).push({r,y})});fbcKey=S.ver}return fbcIdx}
let fcCache=new Map(),fcKey='';
function ferCalc(c,t){
  t=t||todayISO();
  const ck=S.ver+'|'+todayISO();if(fcKey!==ck){fcCache=new Map();fcKey=ck}
  const cacheable=c&&t===todayISO();
  if(cacheable&&fcCache.has(c))return fcCache.get(c);
  const out=ferCalc_(c,t);if(cacheable)fcCache.set(c,out);return out;
}
function ferCalc_(c,t){
  if(!c)return null;
  let base=pd(c.ferBase)?c.ferBase:'',ref=pd(c.ferRef)?c.ferRef:'',ven=+c.ferVen||0,ab=+c.ferAbat||0,est=false;
  if(!base){const a=c.admissao;if(!pd(a)||a>t)return null;est=true;let k=0;while(addY(a,k+1)<=t)k++;base=addY(a,k);ref='';ven=0;ab=0}
  const all=(c.id&&feByC().get(c.id))||[];
  const recs=all.filter(x=>!ref||x.y.ini>ref);
  const taken=recs.filter(x=>x.y.ini<=t),prog=recs.filter(x=>x.y.ini>t).sort((a,b)=>a.y.ini.localeCompare(b.y.ini));
  const P=[];
  for(let k=0;k<40;k++){const ini=addY(base,k);if(k>0&&ini>t)break;const fim=addD(addY(base,k+1),-1);
    let E=30;if(k===0)E=Math.max(0,(!est&&ref&&avos(base,ref)>=12?ven:30)-ab);
    P.push({ini,fim,E,u:0,av:avos(ini,t)})}
  let T=taken.reduce((s,x)=>s+(+x.r.dias||30),0);
  P.forEach(p=>{const u=Math.min(T,p.E);p.u=u;T-=u});if(T>0)P[P.length-1].u+=T;
  const comp=P.filter(p=>p.av>=12),cur=P.find(p=>p.av<12)||null;
  const pend=comp.filter(p=>p.E-p.u>0);
  const ven_=pend.reduce((s,p)=>s+(p.E-p.u),0);
  const acc=cur?Math.min(cur.E,cur.av*2.5):0;
  const prop=cur?Math.max(0,acc-cur.u):0,adv=cur?Math.max(0,cur.u-acc):0;
  const show=pend[0]||cur||P[P.length-1];
  const ideal=addD(show.fim,30),max=addD(addY(show.fim,1),-45),conc=addD(addY(show.fim,1),-1);
  const dLim=dDiff(t,max);
  const progDias=prog.reduce((s,x)=>s+(+x.r.dias||30),0);
  const hoje=all.find(x=>t>=x.y.ini&&t<=x.y.ter)||null;
  return {est,base,ref,P,pend,cur,ven:ven_,prop,adv,total:ven_+prop,nVenc:pend.length,show,venc:!!pend[0],ideal,max,conc,dLim,taken,prog,progDias,next:prog[0]||null,hoje};
}
const FSIT={estourado:{l:'Limite vencido',t:'neg',o:0},limite:{l:'Limite próximo',t:'warn',o:1},vencida:{l:'Férias vencidas',t:'amb',o:2},ok:{l:'Em dia',t:'pos',o:3},sem:{l:'Sem dados',t:'dash',o:4}};
function fsit(f,lim){if(!f)return 'sem';if(!f.venc)return 'ok';return f.dLim<0?'estourado':f.dLim<=lim?'limite':'vencida'}
const limTxt=f=>!f?'':f.dLim<0?`venceu há ${-f.dLim} dia${f.dLim===-1?'':'s'}`:f.dLim===0?'vence hoje':`em ${f.dLim} dia${f.dLim===1?'':'s'}`;
const fracLbl=r=>`${tipoLbl(r.tipo)} · ${r.dias||30} dias`;

/* ---------- cadastro: quadro de férias ---------- */

  const f=ferCalc(o);
  if(!f)return `<div class="ferbox none">${ic('cal')}<span>Sem dados de férias. Informe a data de admissão, ou importe o relatório GPER400 em <b>Programação de férias › Gerenciar férias</b>.</span></div>`;
  const s=fsit(f,(S.fe.g||{}).lim||60);const st=FSIT[s];
  const nx=f.hoje?`Em férias até ${fmtDate(f.hoje.y.ter)}`:f.next?`${fmtDate(f.next.y.ini)} · ${esc(fracLbl(f.next.r))}`:'Não programadas';
  return `<div class="ferbox">
    <div class="fbh"><span class="st ${st.t}">${st.l}</span>${f.nVenc>1?`<span class="st neg">${f.nVenc} períodos vencidos</span>`:''}${f.est?'<span class="fbe">Estimado pela admissão</span>':''}</div>
    <div class="fbg">
      <div class="w2"><span>Período aquisitivo${f.venc?' vencido':' em aquisição'}</span><b>${fmtDate(f.show.ini)} a ${fmtDate(f.show.fim)}</b></div>
      <div><span>Limite ideal</span><b>${fmtDate(f.ideal)}</b></div>
      <div class="${s==='estourado'?'neg':s==='limite'?'warn':''}"><span>Limite máximo</span><b>${fmtDate(f.max)}</b><small>${f.venc?limTxt(f):'do período em aquisição'}</small></div>
      <div><span>Férias vencidas</span><b class="big">${fdias(f.ven)}</b><small>dias</small></div>
      <div><span>Proporcionais</span><b class="big">${fdias(f.prop)}</b><small>dias${f.cur?` · ${f.cur.av}/12 avos`:''}</small></div>
      <div><span>Saldo total</span><b class="big">${fdias(f.total)}</b><small>dias${f.adv?` · ${fdias(f.adv)} antecipados`:''}</small></div>
      <div class="w3"><span>Próximas férias</span><b class="sm">${nx}</b>${f.progDias?`<small>${f.progDias} dias programados · saldo depois: ${fdias(f.total-f.progDias)}</small>`:''}</div>
    </div>
    <p class="fbn">${f.est?'Calculado a partir da admissão, considerando que os períodos anteriores já foram gozados.':`Saldo da data base de ${fmtDate(f.base)}${f.ref?`, conferido em ${fmtDate(f.ref)}`:''}. Férias iniciadas depois dessa data são descontadas automaticamente${f.taken.length?` (${f.taken.length} já descontada${f.taken.length>1?'s':''})`:''}.`}</p></div>`;
}

/* ---------- subrotina: gerenciar férias ---------- */
function gerRows(){
  const G=S.fe.g,t=todayISO();
  let a=ativos().map(c=>{const f=ferCalc(c);return {c,f,s:fsit(f,G.lim)}});
  const q=fold(G.q);if(q){const qd=digits(G.q);a=a.filter(x=>fold(x.c.nome).includes(q)||(qd.length>=3&&(digits(x.c.matricula).includes(qd)||digits(x.c.sispat).includes(qd))))}
  if(G.setor)a=a.filter(x=>x.c.setorId===G.setor);
  if(G.trecho)a=a.filter(x=>x.c.trechoId===G.trecho);
  return a;
}
function gerFilter(a,sit){return !sit?a:sit==='alerta'?a.filter(x=>x.s==='estourado'||x.s==='limite'):sit==='venc'?a.filter(x=>x.f&&x.f.venc):sit==='prog'?a.filter(x=>x.f&&x.f.next):sit==='hoje'?a.filter(x=>x.f&&x.f.hoje):a.filter(x=>x.s===sit)}

function wireGer(){
  const m=$('#main'),G=S.fe.g;
  $$('[data-gsit]',m).forEach(b=>b.addEventListener('click',()=>{G.sit=G.sit===b.dataset.gsit?'':b.dataset.gsit;render()}));
  $$('[data-glim]',m).forEach(b=>b.addEventListener('click',()=>{G.lim=+b.dataset.glim;render()}));
  const q=$('#g-q',m);if(q)q.addEventListener('input',()=>{G.q=q.value;render()});
  const se=$('#g-se',m);if(se)se.addEventListener('change',()=>{G.setor=se.value;render()});
  const tr=$('#g-tr',m);if(tr)tr.addEventListener('change',()=>{G.trecho=tr.value;render()});
  $$('[data-gclr]',m).forEach(b=>b.addEventListener('click',()=>{Object.assign(G,{q:'',sit:'',setor:'',trecho:''});render()}));
  $$('[data-gprog]',m).forEach(b=>b.addEventListener('click',()=>progDialog(b.dataset.gprog)));
  $$('[data-gmenu]',m).forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();const c=refRec('colaboradores',b.dataset.gmenu);const n=saldoN(c&&ferCalc(c));
    openMMenu(b,[
    {l:'30 dias · Integral',s:'Começa quando termina a folga',fn:()=>progDialog(b.dataset.gmenu,'int')},
    ...(n>0&&n<30?[{l:`Saldo · ${n} dias`,s:'Sai só com os dias que tem de saldo',fn:()=>progDialog(b.dataset.gmenu,'saldo')}]:[]),
    {l:'Fracionada · 14 + 8 + 8',s:'1ª no desembarque; 2ª e 3ª no 3º dia de folga',fn:()=>progDialog(b.dataset.gmenu,'frac')},
    {l:'Dias livres',s:'Você digita quantos dias ele sairá',fn:()=>progDialog(b.dataset.gmenu,'livre')}])}));
  $$('[data-gopen]',m).forEach(b=>b.addEventListener('click',()=>openPanel('colaboradores',b.dataset.gopen)));
  const im=$('[data-gimp]',m);if(im)im.addEventListener('click',()=>$('#fileGper').click());
  const ex=$('[data-gexp]',m);if(ex)ex.addEventListener('click',exportGer);
}
let mmenu=null;
function closeMMenu(){if(mmenu){mmenu.remove();mmenu=null;document.removeEventListener('pointerdown',mmOut,true)}}
function mmOut(e){if(mmenu&&!mmenu.contains(e.target))closeMMenu()}
function openMMenu(btn,items){
  closeMMenu();const el=document.createElement('div');el.className='mmenu';el.setAttribute('role','menu');
  el.innerHTML=items.map((x,i)=>`<button type="button" role="menuitem" data-mi="${i}"><b>${esc(x.l)}</b>${x.s?`<small>${esc(x.s)}</small>`:''}</button>`).join('');
  document.body.appendChild(el);mmenu=el;
  const r=btn.getBoundingClientRect();const w=el.offsetWidth,h=el.offsetHeight;
  el.style.left=Math.max(8,Math.min(innerWidth-w-8,r.right-w))+'px';el.style.top=(r.bottom+6+h>innerHeight-8?Math.max(8,r.top-h-6):r.bottom+6)+'px';
  $$('[data-mi]',el).forEach(b=>b.addEventListener('click',()=>{const it=items[+b.dataset.mi];closeMMenu();it.fn()}));
  el.addEventListener('keydown',e=>{if(e.key==='Escape'){closeMMenu();btn.focus()}});
  setTimeout(()=>{document.addEventListener('pointerdown',mmOut,true);const f=$('button',el);f&&f.focus()},0);
}

/* ---------- programar férias (integral ou fracionada) ---------- */
function desOpts(c,off,n){const y=ciclo(c);if(!y.des)return [];const st=(+c.trab||0)+(c.folga==null?0:+c.folga);const t=todayISO();let d=y.des;
  if(st<=0)return addD(d,off)>=t?[d]:[];
  while(addD(d,off)<t)d=addD(d,st);
  if(addD(d,-st)&&addD(addD(d,-st),off)>=t)d=addD(d,-st);
  return Array.from({length:n},(_,i)=>addD(d,i*st));}
const tipoLbl=t=>t==='INTEGRAL'?'Integral':t==='SALDO'?'Saldo':t==='LIVRE'?'Dias livres':String(t||'').replace(' PARCELA',' parcela');
/* saldo usado na opção "Saldo": o que resta do período vencido mais antigo; sem vencidas, o saldo proporcional */
function saldoN(f){if(!f)return 0;if(f.venc){const p=f.pend[0];return Math.max(0,Math.floor(p.E-p.u))}return f.total>0?Math.floor(f.total):0}
const INI_OPTS=fol=>[{v:fol,l:`Fim da folga (desembarque + ${fol})`},{v:2,l:'3º dia de folga (desembarque + 2)'},{v:0,l:'No dia do desembarque'}];
function progDialog(cid,tipo){
  const c=refRec('colaboradores',cid);if(!c)return;
  const f=ferCalc(c);const fol=c.folga==null?14:+c.folga,trab=c.trab==null?14:+c.trab;
  const se=refRec('setores',c.setorId);
  const cobs=['SEM COBERTURA','VERIFICAR',...(c.backId&&refRec('colaboradores',c.backId)?[shortName(refRec('colaboradores',c.backId).nome)]:[]),...ativos().map(x=>shortName(x.nome))];
  const hasEsc=!!(c.embarque&&c.trab!=null);
  const sN=saldoN(f),hasS=sN>0&&sN<30;
  let T=['int','frac','saldo','livre'].includes(tipo)?tipo:(hasS?'saldo':'int');if(T==='saldo'&&!hasS)T='int';
  let offS=fol,livre=hasS?sN:30;
  const Lc={};const getL=()=>{const off=T==='frac'?0:T==='int'?fol:offS;const n=T==='frac'?16:14;const k=off+'|'+n;return Lc[k]||(Lc[k]=desOpts(c,off,n))};
  let sel=[0,1,2];
  const parts=()=>T==='int'?[{tipo:'INTEGRAL',off:fol,dias:30}]:T==='saldo'?[{tipo:'SALDO',off:offS,dias:sN}]:T==='livre'?[{tipo:'LIVRE',off:offS,dias:livre}]:[{tipo:'1ª PARCELA',off:0,dias:14},{tipo:'2ª PARCELA',off:2,dias:8},{tipo:'3ª PARCELA',off:2,dias:8}];
  const desSel=(i,L)=>hasEsc?`<span class="sel"><select class="in mono" data-pd="${i}">${L.map((d,j)=>`<option value="${j}" ${sel[i]===j?'selected':''}>${fmtDate(d)} · ${wd(d)}</option>`).join('')}</select>${ic('chev')}</span>`:`<input class="in mono" type="date" data-pdd="${i}" value="${esc(($(`[data-pdd="${i}"]`)||{}).value||'')}">`;
  showDlg(`<div class="dh ok"><span class="ic">${ic('cal')}</span><div><h3>Programar férias</h3><p>${esc(c.nome)}${c.matricula?` · MAT ${esc(c.matricula)}`:''} · escala ${esc(escalaTxt(c))}</p></div></div>
    <div class="pgsum">${f?`<div><span>Período aquisitivo</span><b>${fmtDate(f.show.ini)} a ${fmtDate(f.show.fim)}</b></div><div><span>Vencidas</span><b>${fdias(f.ven)}</b></div><div><span>Proporc.</span><b>${fdias(f.prop)}</b></div><div class="${f.venc&&f.dLim<0?'neg':f.venc&&f.dLim<=60?'warn':''}"><span>Limite máximo</span><b>${fmtDate(f.max)}</b></div>`:'<div class="w4"><span>Saldo</span><b>Sem dados de férias para este colaborador</b></div>'}</div>
    <form class="pform" id="pgForm" novalidate>
      <div class="field"><label>Tipo de férias</label><div class="seg full pgt" role="radiogroup"><button type="button" role="radio" data-pt="int">30 dias · Integral</button>${hasS?`<button type="button" role="radio" data-pt="saldo">Saldo · ${sN} dias</button>`:''}<button type="button" role="radio" data-pt="frac">Fracionada · 14 + 8 + 8</button><button type="button" role="radio" data-pt="livre">Dias livres</button></div><small class="help" id="pg-h"></small></div>
      <div id="pg-sel"></div>
      <div class="pform3"><div class="field"><label for="pg-c">Cobertura</label><input class="in" id="pg-c" list="dl-pgc" value="${c.backId&&refRec('colaboradores',c.backId)?esc(shortName(refRec('colaboradores',c.backId).nome)):'SEM COBERTURA'}" maxlength="60" autocomplete="off"><datalist id="dl-pgc">${[...new Set(cobs)].map(x=>`<option value="${esc(x)}"></option>`).join('')}</datalist></div>
        <div class="field"><label for="pg-g">Gerência</label><input class="in" id="pg-g" value="${esc(se?se.nome:'')}" maxlength="40" autocomplete="off"></div></div>
      <div id="pg-pv"></div><div id="pg-w"></div><small class="err" id="pg-e"></small>
      <button type="submit" hidden></button></form>
    <div class="df"><button class="btn" type="button" data-dx>Cancelar</button><button class="btn emph" type="button" data-dok>${ic('check')}Programar</button></div>`);
  $('#dlg .box').classList.add('wide');
  const calc=()=>{const L=getL();return parts().map((p,i)=>{let des='';if(hasEsc)des=L[sel[i]]||'';else{const el=$(`[data-pdd="${i}"]`);des=el&&pd(el.value)?el.value:''}
    const ok=p.dias>=1;const ini=des&&ok?addD(des,p.off):'',ter=ini?addD(ini,p.dias-1):'',ret=ter?[addD(ter,1),addD(des,fol)].sort().pop():'';return {...p,des,ini,ter,ret}})};
  const one=()=>T==='saldo'||T==='livre';
  const drawSel=()=>{const L=getL();
    $$('[data-pt]').forEach(b=>{b.classList.toggle('on',b.dataset.pt===T);b.setAttribute('aria-checked',b.dataset.pt===T)});
    $('#pg-h').textContent=T==='int'?`Começa no dia seguinte ao fim da folga (desembarque + ${fol}) e dura 30 dias.`:T==='frac'?`1ª parcela: 14 dias a partir do desembarque. 2ª e 3ª: 8 dias a partir do 3º dia de folga dos desembarques seguintes.`:T==='saldo'?`Sai com os ${sN} dias que restam ${f&&f.venc?'do período vencido':'do saldo'}. Escolha quando começa.`:'Informe quantos dias ele sairá e quando começa.';
    const extra=one()?`<div class="field"><label for="pg-off">Início das férias</label><span class="sel"><select class="in" id="pg-off">${INI_OPTS(fol).map(o=>`<option value="${o.v}" ${o.v===offS?'selected':''}>${esc(o.l)}</option>`).join('')}</select>${ic('chev')}</span></div>
      <div class="field"><label for="pg-n">Dias de férias</label>${T==='livre'?`<input class="in mono" id="pg-n" type="number" min="1" max="60" step="1" inputmode="numeric" value="${livre}">`:`<input class="in mono" id="pg-n" type="number" value="${sN}" readonly aria-readonly="true" title="Saldo do colaborador">`}</div>`:'';
    const lbl=i=>T==='frac'?`Desembarque · ${tipoLbl(parts()[i].tipo)}`:'Desembarque antes das férias';

      :`<div class="pform3 ${one()?'c3':''}"><div class="field"><label>${lbl(0)}</label>${desSel(0,L)}</div>${extra}</div>`)+(hasEsc?'':'<small class="help">Este colaborador não tem escala no cadastro; informe as datas de desembarque.</small>');
    $$('[data-pd]').forEach(s=>s.addEventListener('change',()=>{const i=+s.dataset.pd;const v=+s.value;if(i===0&&T==='frac'){const d=v-sel[0];sel=sel.map((x,j)=>j===0?v:Math.min(L.length-1,x+d))}else sel[i]=v;drawSel()}));
    $$('[data-pdd]').forEach(s=>s.addEventListener('change',prev));
    const so=$('#pg-off');if(so)so.addEventListener('change',()=>{const cur=(getL()[sel[0]]||'');offS=+so.value;const nl=getL();const j=nl.indexOf(cur);sel[0]=j>=0?j:0;drawSel()});
    const ni=$('#pg-n');if(ni&&T==='livre')ni.addEventListener('input',()=>{const v=parseInt(ni.value,10);livre=Number.isFinite(v)?Math.max(0,Math.min(60,v)):0;prev()});
    prev()};
  const prev=()=>{const P=calc();const tot=P.reduce((s,p)=>s+(p.dias||0),0);
    $('#pg-pv').innerHTML=`<table class="pvt"><thead><tr><th>${T==='frac'?'Parcela':'Tipo'}</th><th class="r">Dias</th><th>Desembarque</th><th>Férias</th><th>Volta a embarcar</th></tr></thead><tbody>${P.map(p=>`<tr><td><b>${tipoLbl(p.tipo)}</b></td><td class="r mono">${p.dias||'—'}</td><td class="mono">${fmtDate(p.des)}</td><td class="mono hl">${p.ini?`${fmtDM(p.ini)} a ${fmtDate(p.ter)}`:'—'}</td><td class="mono">${fmtDate(p.ret)}</td></tr>`).join('')}</tbody></table>`;
    const w=[];
    if(P[0].ini&&f){const fa=ferCalc(c,P[0].ini);const disp=fa?fa.total:0;if(tot>disp+0.01)w.push(`O saldo previsto em ${fmtDate(P[0].ini)} é de ${fdias(disp)} dias; ${fdias(tot-disp)} serão antecipados do período em aquisição.`);
      if(f.venc&&P[0].ini>f.max)w.push(`${P.length>1?'A primeira parcela':'As férias'} começa${P.length>1?'':'m'} depois do limite máximo (${fmtDate(f.max)}).`)}

function inferRef(list){
  const sm=list.filter(r=>!r.ven&&r.base).slice(0,500);if(!sm.length)return todayISO();
  let best=todayISO(),bs=-1;const t=todayISO();
  for(let i=0;i<=420;i++){const d=addD(t,-i);let s=0;sm.forEach(r=>{if(Math.abs(avos(r.base,d)*2.5-r.prop)<0.01)s++});if(d.endsWith('-01'))s+=0.5;if(s>bs){bs=s;best=d}}
  return best;
}

async function cloudStart(){
  CLOUD.cfg=cloudCfg();updateCloudChip();if(!CLOUD.cfg)return;
  loadBase();CLOUD.token=loadSess();setCloudSt('sync','Conectando…');
  try{await loadSB()}catch(e){setCloudSt('err','Sem internet para abrir o banco.');if(!CLOUD.token)showLogin(null,'Sem conexão com a internet. Verifique a rede e recarregue a página.');return}
  try{CLOUD.sb=window.supabase.createClient(CLOUD.cfg.url,CLOUD.cfg.key,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}})}
  catch(e){setCloudSt('err','URL ou chave do Supabase inválida.');cloudDialog();return}
  if(!CLOUD.token){setCloudSt('login');showLogin();return}
  try{const eu=await rpc('epa_eu');await cloudAfterLogin(eu)}
  catch(e){if(isAuthErr(e))return;if(/function|schema cache/i.test(e.message||'')){showLogin('setup');return}setCloudSt('err',cloudErr(e))}
}
async function cloudAfterLogin(eu){
  CLOUD.user={id:eu.id,login:eu.login,nome:eu.nome||eu.login};CLOUD.papel=eu.papel;CLOUD.nome=eu.nome||eu.login;CLOUD.rotinas=Array.isArray(eu.rotinas)?eu.rotinas:null;US.list=null;updateCloudChip();onHash();
  if(eu.trocar_senha){showLogin('troca');return}
  hideLogin();setCloudSt('sync','Carregando…');
  try{
    if(!CLOUD.base.size){
      const n=await rpc('epa_contar');
      if(!n){setCloudSt('ok');if(CLOUD.papel==='adm'&&(S.data.colaboradores||[]).length)askFirstUpload();else toast(CLOUD.papel==='adm'?'O banco está vazio. Abra o arquivo do sistema que tem os dados e envie por ele.':'O banco ainda está vazio. Peça ao ADM para enviar os dados.','neg')}
      else{await cloudPull(true);toast(`Dados carregados do banco · ${CLOUD.nome}`)}
    }else{await cloudPull(false);await cloudPush()}
  }catch(e){if(!isAuthErr(e))setCloudSt('err',cloudErr(e))}
  cloudPolling();updateCloudChip();
}
function askFirstUpload(){
  const n=c=>(S.data[c]||[]).length;
  showDlg(`<div class="dh ok"><span class="ic">${ic('upload')}</span><div><h3>Enviar os dados para o banco?</h3><p>O banco do Efetivo PA no Supabase está vazio. Os dados deste computador vão virar a base que todos vão usar.</p><ul>
    <li><b>${n('colaboradores')}</b> colaboradores, <b>${n('setores')}</b> setores, <b>${n('funcoes')}</b> funções e <b>${n('trechos')}</b> trechos</li>
    <li><b>${n('postergacoes')}</b> postergações, <b>${n('ausencias')}</b> atestados e faltas, <b>${n('ferias')}</b> férias, <b>${n('noshow')}</b> no-shows</li>
    <li><b>${n('movs')}</b> saídas do efetivo e <b>${n('rotas')}</b> rotas com horários</li></ul></div></div>
    <div class="df"><button class="btn" type="button" data-dx>Agora não</button><button class="btn emph" type="button" data-dok>${ic('upload')}Enviar agora</button></div>`);
  $('#dlg [data-dok]').addEventListener('click',async e=>{const b=e.currentTarget;b.disabled=true;b.innerHTML='<span class="spin"></span>Enviando…';const r=await cloudPush();hideDlg();
    if(r>=0)toast(`Dados enviados ao banco: ${r} registros`);else toast(CLOUD.msg||'Não foi possível enviar.','neg')});
}

        <td class="c">${sw(`data-uad="${esc(u.id)}"`,adm,self,'Administrador')}<small class="swl">${adm?'Administrador':'Não'}</small></td>
        <td class="c">${sw(`data-uat="${esc(u.id)}"`,u.ativo,self,'Acesso ativo')}<small class="swl">${u.ativo?(u.trocar_senha?'Aguardando 1º acesso':'Ativo'):'Bloqueado'}</small></td>
        <td>${u.papel==='adm'?`<span class="rotb dis">${rotTxt(u)}</span>`:`<button type="button" class="rotb" data-urot="${esc(u.id)}" title="${esc(Array.isArray(u.rotinas)?ROTINAS.filter(x=>u.rotinas.includes(x[0])).map(x=>x[1]).join(', '):'Todas as rotinas')}">${ic('edit')}${rotTxt(u)}</button>`}</td>
        <td class="mono dt2">${u.ultimo_acesso?fmtDT(u.ultimo_acesso):'<span class="dim">nunca</span>'}</td>
        <td class="acts">${self?'':`<button class="ibtn" type="button" data-upw="${esc(u.id)}" title="Gerar nova senha provisória" aria-label="Nova senha para ${esc(u.login)}">${ic('reset')}</button><button class="ibtn del" type="button" data-udel="${esc(u.id)}" title="Excluir usuário" aria-label="Excluir ${esc(u.login)}">${ic('trash')}</button>`}</td></tr>`}).join('')
    :`<tr class="none"><td colspan="7"><div class="empty"><span class="ic">${ic('users')}</span><h3>Ninguém encontrado</h3><p>Ajuste a busca.</p></div></td></tr>`;
  const lbl={ok:'Sincronizado',sync:'Salvando…',err:'Sem conexão',login:'Desconectado',ro:'Somente leitura'}[CLOUD.st]||'';
  return `<div class="page"><div class="ph"><div>${crumb}<h1>Gerenciar usuários</h1><p>Quem pode entrar no Efetivo PA, quem pode editar e quem é administrador.</p></div>
      <div class="acts"><button class="btn emph" type="button" data-unew>${ic('plus')}Cadastrar usuário</button></div></div>
    <div class="kpis">${k('Usuários',L.length,'cadastrados','var(--accent)')}${k('Administradores',L.filter(u=>u.papel==='adm').length,'gerenciam usuários','var(--brand-o)')}${k('Podem editar',L.filter(u=>u.papel!=='leitura'&&u.ativo).length,'incluindo ADMs','var(--pos)')}${k('Só consulta',L.filter(u=>u.papel==='leitura'&&u.ativo).length,'não alteram nada','var(--info)')}</div>
    <section class="card tcard"><div class="tbar"><h2>Usuários <span>(${L.length})</span></h2><span class="srch ussrch">${ic('search')}<input class="in" id="us-q" type="search" value="${esc(US.q)}" placeholder="Buscar nome ou usuário" autocomplete="off"></span></div>
      <div class="tscroll"><table class="ustab"><thead><tr><th>Usuário</th><th class="c">Pode editar</th><th class="c">Administrador</th><th class="c">Acesso</th><th>Rotinas</th><th>Último acesso</th><th><span class="vh">Ações</span></th></tr></thead><tbody>${body}</tbody></table></div></section>
    <section class="card ussync"><div><b>Sincronização</b><small>${esc(lbl)}${CLOUD.last?' · última '+fmtDT(CLOUD.last):''}${CLOUD.msg?' · '+esc(CLOUD.msg):''}</small></div><span class="sp"></span><button class="btn" type="button" data-usync>${ic('reset')}Sincronizar agora</button><button class="btn" type="button" data-usall title="Grava no banco tudo o que está neste computador">${ic('upload')}Enviar tudo deste computador</button></section>
  </div>`;
}
async function usSave(u,ch,pw){await rpc('epa_usuario_salvar',{p_id:u?u.id:null,p_login:ch.login??u.login,p_nome:ch.nome??u.nome??'',p_papel:ch.papel??u.papel,p_ativo:ch.ativo??u.ativo,p_senha:pw??null,p_rotinas:ch.rotinas!==undefined?ch.rotinas:(u&&Array.isArray(u.rotinas)?u.rotinas:null)})}
/* caixas de marcar das rotinas (sel = lista liberada; null = todas) */
function rotChecksHTML(sel){const on=k=>!Array.isArray(sel)||sel.includes(k);const g=[...new Set(ROTINAS.map(x=>x[2]))];
  return `<div class="rotbox"><div class="rothd"><b>Rotinas que aparecem para o usuário</b><span><button type="button" class="lnk2" data-rall="1">Marcar todas</button> · <button type="button" class="lnk2" data-rall="0">Desmarcar todas</button></span></div>
    ${g.map(gr=>`<div class="rotg"><small>${gr}</small><div class="rotl">${ROTINAS.filter(x=>x[2]===gr).map(([k,l])=>`<label class="rotc"><input type="checkbox" data-rot="${k}" ${on(k)?'checked':''}><span>${esc(l)}</span></label>`).join('')}</div></div>`).join('')}</div>`}
function wireRotChecks(box){$$('[data-rall]',box).forEach(b=>b.addEventListener('click',()=>$$('[data-rot]',box).forEach(c=>c.checked=b.dataset.rall==='1')))}
function readRot(box){const all=$$('[data-rot]',box);const on=all.filter(c=>c.checked).map(c=>c.dataset.rot);return on.length===all.length?null:on}
const rotTxt=u=>u.papel==='adm'?'Todas (ADM)':!Array.isArray(u.rotinas)?'Todas':`${u.rotinas.length} de ${ROTINAS.length}`;
function wireUsers(){
  const m=$('#main');if(CLOUD.papel!=='adm')return;
  const U=new Map((US.list||[]).map(u=>[u.id,u]));
  const q=$('#us-q',m);if(q)q.addEventListener('input',()=>{US.q=q.value;render()});
  const re=$('[data-usre]',m);if(re)re.addEventListener('click',()=>{US.err='';render()});
  $$('[data-unew]',m).forEach(b=>b.addEventListener('click',()=>userDialog()));
  const upd=async(id,ch,msg)=>{const u=U.get(id);try{await usSave(u,ch);toast(msg);await usLoad()}catch(e){toast(cloudErr(e),'neg');render()}};
  $$('[data-ued]',m).forEach(x=>x.addEventListener('change',()=>{const u=U.get(x.dataset.ued);upd(u.id,{papel:papelDe(x.checked,false)},x.checked?`${u.nome||u.login} agora pode editar`:`${u.nome||u.login} agora só consulta`)}));
  $$('[data-uad]',m).forEach(x=>x.addEventListener('change',()=>{const u=U.get(x.dataset.uad);upd(u.id,{papel:x.checked?'adm':'editor'},x.checked?`${u.nome||u.login} agora é administrador`:`${u.nome||u.login} deixou de ser administrador`)}));
  $$('[data-uat]',m).forEach(x=>x.addEventListener('change',()=>{const u=U.get(x.dataset.uat);upd(u.id,{ativo:x.checked},x.checked?`Acesso de ${u.nome||u.login} liberado`:`Acesso de ${u.nome||u.login} bloqueado`)}));
  $$('[data-urot]',m).forEach(b=>b.addEventListener('click',()=>{const u=U.get(b.dataset.urot);
    showDlg(`<div class="dh ok"><span class="ic">${ic('edit')}</span><div><h3>Rotinas de ${esc(u.nome||u.login)}</h3><p>Marque as telas que vão aparecer no menu dessa pessoa.</p></div></div>${rotChecksHTML(u.rotinas)}<small class="err" id="ur-e"></small>
      <div class="df"><button class="btn" type="button" data-dx>Cancelar</button><button class="btn emph" type="button" data-dok>${ic('check')}Salvar</button></div>`);
    const box=$('#dlg .rotbox');wireRotChecks(box);
    $('#dlg [data-dok]').addEventListener('click',async()=>{const r=readRot(box);if(Array.isArray(r)&&!r.length){$('#ur-e').textContent='Marque pelo menos uma rotina.';return}
      try{await usSave(u,{rotinas:r});hideDlg();toast(`Rotinas de ${u.nome||u.login} salvas`);usLoad()}catch(e){$('#ur-e').textContent=cloudErr(e)}})}));
  $$('[data-upw]',m).forEach(b=>b.addEventListener('click',()=>{const u=U.get(b.dataset.upw);
    showDlg(`<div class="dh blk"><span class="ic">${ic('reset')}</span><div><h3>Gerar nova senha para ${esc(u.nome||u.login)}?</h3><p>A senha atual deixa de valer na hora e a pessoa vai criar uma nova no próximo acesso.</p></div></div><div class="df"><button class="btn" type="button" data-dx>Cancelar</button><button class="btn emph" type="button" data-dok>${ic('reset')}Gerar senha</button></div>`);
    $('#dlg [data-dok]').addEventListener('click',async()=>{const pw=senhaProv();try{await usSave(u,{},pw);showPwResult(u.nome||u.login,u.login,pw,false);usLoad()}catch(e){hideDlg();toast(cloudErr(e),'neg')}})}));
  $$('[data-udel]',m).forEach(b=>b.addEventListener('click',()=>{const u=U.get(b.dataset.udel);
    showDlg(`<div class="dh"><span class="ic">${ic('trash')}</span><div><h3>Excluir ${esc(u.nome||u.login)}?</h3><p>O usuário <b class="mono">${esc(u.login)}</b> deixa de existir. Se for só por um tempo, prefira desligar o acesso.</p></div></div><div class="df"><button class="btn" type="button" data-dx>Cancelar</button><button class="btn danger emph" type="button" data-dok>${ic('trash')}Excluir</button></div>`);
    $('#dlg [data-dok]').addEventListener('click',async()=>{try{await rpc('epa_usuario_remover',{p_id:u.id});hideDlg();toast(`Usuário ${u.login} excluído`);usLoad()}catch(e){hideDlg();toast(cloudErr(e),'neg')}})}));
  const sy=$('[data-usync]',m);if(sy)sy.addEventListener('click',async()=>{await cloudPull(false);const r=await cloudPush();if(r>=0)toast('Sincronizado');render()});
  const al=$('[data-usall]',m);if(al)al.addEventListener('click',()=>{showDlg(`<div class="dh blk"><span class="ic">${ic('upload')}</span><div><h3>Enviar tudo deste computador?</h3><p>Todos os registros daqui serão gravados no banco por cima dos que estão lá. Use só se o banco estiver desatualizado.</p></div></div><div class="df"><button class="btn" type="button" data-dx>Cancelar</button><button class="btn emph" type="button" data-dok>${ic('upload')}Enviar tudo</button></div>`);
    $('#dlg [data-dok]').addEventListener('click',async e=>{e.currentTarget.disabled=true;e.currentTarget.innerHTML='<span class="spin"></span>Enviando…';CLOUD.base=new Map();const r=await cloudPush();hideDlg();toast(r>=0?`${r} registros enviados`:(CLOUD.msg||'Não foi possível enviar.'),r>=0?'':'neg')})});
}
function userDialog(){
  showDlg(`<div class="dh ok"><span class="ic">${ic('plus')}</span><div><h3>Cadastrar usuário</h3><p>O sistema cria uma senha provisória; a pessoa troca no primeiro acesso.</p></div></div>
    <form class="pform" id="unForm" novalidate>
      <div class="field"><label for="un-n">Nome<b class="req">*</b></label><input class="in" id="un-n" maxlength="60" placeholder="Ex.: Maria Silva" autocomplete="off"></div>
      <div class="field"><label for="un-l">Usuário (para entrar)<b class="req">*</b></label><input class="in mono" id="un-l" maxlength="60" placeholder="Ex.: maria.silva" autocomplete="off" autocapitalize="none" spellcheck="false"><small class="help">Só letras, números, ponto e traço. Sem espaços.</small></div>
      <div class="unsw"><label class="switch"><input type="checkbox" id="un-ed" checked><span class="tr"></span><span><b>Pode editar</b><small>Desligado: só consulta, não altera nada</small></span></label>
        <label class="switch"><input type="checkbox" id="un-ad"><span class="tr"></span><span><b>Administrador</b><small>Gerencia usuários e vê todas as rotinas</small></span></label></div>
      <div id="un-rot">${rotChecksHTML(null)}</div>
      <small class="err" id="un-e"></small><button type="submit" hidden></button></form>
    <div class="df"><button class="btn" type="button" data-dx>Cancelar</button><button class="btn emph" type="button" data-dok>${ic('check')}Cadastrar</button></div>`);
  const n=$('#un-n'),l=$('#un-l'),ed=$('#un-ed'),ad=$('#un-ad');let touched=false;
  n.addEventListener('input',()=>{if(!touched)l.value=sugLogin(n.value)});l.addEventListener('input',()=>{touched=true;l.value=l.value.toLowerCase().replace(/[^a-z0-9._-]/g,'')});
  const rb=$('#un-rot .rotbox');wireRotChecks(rb);
  ad.addEventListener('change',()=>{if(ad.checked){ed.checked=true;ed.disabled=true}else ed.disabled=false;$('#un-rot').hidden=ad.checked});
  setTimeout(()=>n.focus(),60);
  const go=async()=>{const nm=clean(n.value),lg=clean(l.value).toLowerCase(),er=$('#un-e');
    if(!nm){er.textContent='Informe o nome.';n.focus();return}if(lg.length<3){er.textContent='O usuário precisa ter pelo menos 3 caracteres.';l.focus();return}
    if((US.list||[]).some(u=>u.login===lg)){er.textContent=`Já existe o usuário ${lg}.`;l.focus();return}
    const rot=ad.checked?null:readRot(rb);if(Array.isArray(rot)&&!rot.length){er.textContent='Marque pelo menos uma rotina.';return}
    const pw=senhaProv();const b=$('#dlg [data-dok]');b.disabled=true;b.innerHTML='<span class="spin"></span>Cadastrando…';
    try{await usSave(null,{login:lg,nome:nm,papel:papelDe(ed.checked,ad.checked),ativo:true,rotinas:rot},pw);showPwResult(nm,lg,pw,true);usLoad()}catch(e){er.textContent=cloudErr(e);b.disabled=false;b.innerHTML=`${ic('check')}Cadastrar`}};
  $('#dlg [data-dok]').addEventListener('click',go);$('#unForm').addEventListener('submit',e=>{e.preventDefault();go()});
}
function showPwResult(nome,login,pw,novo){
  showDlg(`<div class="dh ok"><span class="ic">${ic('check')}</span><div><h3>${novo?'Usuário cadastrado':'Nova senha gerada'}</h3><p>Passe estes dados para <b>${esc(nome)}</b>. No primeiro acesso o sistema pede para criar a senha definitiva.</p></div></div>
    <div class="pwres"><div><span>Usuário</span><b class="mono">${esc(login)}</b></div><div><span>Senha provisória</span><b class="mono">${esc(pw)}</b></div></div>
    <p class="mhint">Esta senha não aparece de novo. Se perder, gere outra na lista de usuários.</p>
    <div class="df"><button class="btn" type="button" id="pwCopy">${ic('file')}Copiar</button><button class="btn emph" type="button" data-dx>Pronto</button></div>`);
  $('#pwCopy').addEventListener('click',async()=>{const t=`Efetivo PA\nUsuário: ${login}\nSenha provisória: ${pw}`;try{await navigator.clipboard.writeText(t);toast('Copiado')}catch(e){toast('Não foi possível copiar; anote os dados.','neg')}});
}
/* menu do usuário no rodapé do menu lateral */
function userMenu(btn){
  if(!CLOUD.user){showLogin();return}
  openMMenu(btn,[{l:'Trocar minha senha',s:CLOUD.user.login,fn:pwDialog},...(CLOUD.papel==='adm'?[{l:'Gerenciar usuários',s:'ADM',fn:()=>go('usuarios')}]:[]),{l:'Sincronizar agora',s:({ok:'Sincronizado',sync:'Salvando…',err:'Sem conexão',ro:'Somente leitura'}[CLOUD.st]||''),fn:async()=>{await cloudPull(false);const r=await cloudPush();if(r>=0)toast('Sincronizado')}},{l:'Sair',s:'Encerrar a sessão neste computador',fn:cloudLogout}]);
}

/* ================= routing & chrome ================= */
const ROUTES=['inicio','embarque','rota','postergacao','ausencias','ferias','noshow','saidas','usuarios',...COLS];
function go(r){if(location.hash!=='#'+r)location.hash=r;else{S.route=r;render()}}
function onHash(){const h=(location.hash||'').replace('#','');let r=ROUTES.includes(h)?h:'inicio';
  if(!canSee(r)){const f=firstAllowed();if(f){if(CLOUD.user&&h&&h!==f&&ROUTES.includes(h))toast('Você não tem acesso a esta rotina.','neg');r=f;if(location.hash!=='#'+f)history.replaceState(null,'','#'+f)}}if(S.panel)closePanel();S.route=r;const ap=$('#app');ap.classList.remove('navopen','expand');ap.classList.toggle('auto-mini',r==='inicio'||r==='embarque'||r==='postergacao'||r==='ausencias'||r==='ferias'||r==='noshow'||r==='saidas');closeAPop();closeCF();render();$('#main').scrollTop=0}
window.addEventListener('hashchange',onHash);
const app=$('#app');
try{if(localStorage.getItem('efetivo-pa-nav')==='mini')app.classList.add('mini')}catch(e){}
$('#navToggleM').addEventListener('click',()=>app.classList.toggle('navopen'));
$('#navToggle').addEventListener('click',()=>{
  if(window.matchMedia('(max-width:900px)').matches)app.classList.toggle('navopen');
  else if(app.classList.contains('auto-mini')&&!app.classList.contains('mini'))app.classList.toggle('expand');
  else{app.classList.toggle('mini');try{localStorage.setItem('efetivo-pa-nav',app.classList.contains('mini')?'mini':'full')}catch(e){}}});
$('#scrimNav').addEventListener('click',()=>app.classList.remove('navopen'));
$('#nav').addEventListener('click',e=>{const l=e.target.closest('a');if(l&&e.detail>0)setTimeout(()=>l.blur(),0)});
$('#scrim').addEventListener('click',closePanel);
$('#navCloud').addEventListener('click',e=>{e.stopPropagation();userMenu($('#navCloud'))});
$('#scrimDlg').addEventListener('click',hideDlg);
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if($('#dlg').classList.contains('on'))hideDlg();else if(S.panel)closePanel();else app.classList.remove('navopen')});


loadData();
onHash();
cloudStart();
})();
</script>
</body>
</html>
